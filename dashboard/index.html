<!doctype html>
<html lang="en" data-theme="night" data-idle="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>claudrunner</title>
<style>
  :root{
    --hazard:#ff8a2b; --neon:#35e0e0; --ok:#5ddc8a; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  /* NIGHT ------------------------------------------------------------------ */
  :root[data-theme="night"]{
    --sky-1:#0b1430; --sky-2:#152a53; --sky-3:#2b3f6b;
    --far:#1b2a4d; --mid:#16233f; --near:#101a30;
    --ground:#0d1526; --ground-top:#1b2b47;
    --ink:#050912; --body:#e4ecf8; --body-2:#b9c8de; --trim:#7d93b5;
    --text:#dbe6f5; --muted:#8fa3c0; --panel:rgba(10,17,30,.9);
    --orb:#f4f1e4; --orb-glow:rgba(244,241,228,.30); --star:1;
  }
  /* DAY -------------------------------------------------------------------- */
  :root[data-theme="day"]{
    --sky-1:#8fd3f4; --sky-2:#cfeaf7; --sky-3:#ffe9c9;
    --far:#a9c8dd; --mid:#7fa6c4; --near:#5b82a6; --ground:#7cc08a; --ground-top:#96d69f;
    --ink:#123047; --body:#ffffff; --body-2:#dbe6f2; --trim:#3d6180;
    --text:#123047; --muted:#40658a; --panel:rgba(255,255,255,.92);
    --orb:#fff3b0; --orb-glow:rgba(255,222,120,.55); --star:0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--sky-1);color:var(--text);font:13px/1.5 var(--mono)}
  svg#stage{position:fixed;inset:0;width:100%;height:100%}

  /* ---- HUD --------------------------------------------------------------- */
  .hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;
    gap:18px;padding:14px 18px;pointer-events:none}
  .hud > *{pointer-events:auto}
  .brand{font-size:15px;letter-spacing:.4em;text-transform:uppercase;font-weight:700;
    color:var(--text);text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .brand b{color:var(--hazard)}
  .chip{font-size:11px;letter-spacing:.16em;padding:5px 10px;border-radius:99px;
    background:var(--panel);color:var(--muted);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .chip b{color:var(--text)}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:6px 14px;
    background:var(--panel);color:var(--text);letter-spacing:.14em;font-size:11px;
    box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .12s ease}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px)}

  /* ---- task drawer, hidden by default ------------------------------------ */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:6;
    background:var(--panel);backdrop-filter:blur(10px);padding:66px 18px 18px;
    transform:translateX(102%);transition:transform .32s cubic-bezier(.3,.9,.3,1);
    box-shadow:-20px 0 60px -30px #000;overflow:auto}
  .drawer.open{transform:none}
  .drawer h2{font-size:10px;letter-spacing:.3em;color:var(--muted);margin:0 0 12px;
    text-transform:uppercase;font-weight:500}
  .task{padding:11px 12px;border-radius:8px;margin-bottom:9px;
    background:rgba(127,127,127,.10);box-shadow:inset 3px 0 0 var(--hazard)}
  .task.review{box-shadow:inset 3px 0 0 var(--neon)}
  .task .t{display:flex;gap:8px;align-items:baseline}
  .task .n{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .p{font-size:10px;letter-spacing:.16em;color:var(--hazard)}
  .task.review .p{color:var(--neon)}
  .task .m{font-size:11px;color:var(--muted);margin-top:2px}
  .bar{height:6px;border-radius:99px;background:rgba(127,127,127,.22);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--hazard);transition:width .6s ease}
  .task.review .bar i{background:var(--neon)}
  .none{color:var(--muted);text-align:center;padding:28px 0}

  /* ---- speech ------------------------------------------------------------ */
  .say{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:4;
    background:var(--panel);color:var(--text);font-size:12px;letter-spacing:.06em;
    padding:10px 16px;border-radius:14px;max-width:min(620px,86vw);text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.16);animation:pop .34s cubic-bezier(.2,1.3,.4,1)}
  .say:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;
    border:8px solid transparent;border-top-color:var(--panel);border-bottom:0}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px) scale(.94)}}

  /* ---- scene motion ------------------------------------------------------ */
  .cloud{animation:drift 90s linear infinite}
  .cloud.b{animation-duration:140s;animation-delay:-40s}
  .cloud.c{animation-duration:190s;animation-delay:-90s}
  @keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1900px)}}
  .stars{opacity:var(--star);transition:opacity .6s ease}
  .twinkle{animation:tw 3.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .orb{filter:drop-shadow(0 0 26px var(--orb-glow))}
  .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .hammer{animation:hammer .62s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 20%}
  @keyframes hammer{0%,100%{transform:rotate(-8deg)}45%{transform:rotate(46deg)}}
  .spark{animation:spark .62s ease-in-out infinite}
  @keyframes spark{0%,48%{opacity:0;transform:translate(0,0) scale(.6)}
    52%{opacity:1}100%{opacity:0;transform:translate(14px,-18px) scale(1.2)}}
  .cape{animation:cape 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes cape{0%,100%{transform:skewX(0)}50%{transform:skewX(-11deg)}}
  .beam{animation:beam 5s ease-in-out infinite}
  @keyframes beam{0%,100%{opacity:.5}50%{opacity:.95}}
  .steam{animation:steam 3s ease-in-out infinite}
  @keyframes steam{0%{opacity:0;transform:translateY(0)}35%{opacity:.75}100%{opacity:0;transform:translateY(-22px)}}
  .zzz{animation:zzz 4s ease-in-out infinite}
  @keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.7)}
    30%{opacity:.9}100%{opacity:0;transform:translate(18px,-34px) scale(1.15)}}
  .visor{animation:blink 6s steps(1) infinite}
  @keyframes blink{0%,96%{opacity:1}97%,99%{opacity:.25}}
  .car{animation:car 22s linear infinite}
  @keyframes car{from{transform:translateX(-260px)}to{transform:translateX(1860px)}}
  .plane{animation:plane 40s linear infinite}
  @keyframes plane{from{transform:translate(-300px,0)}to{transform:translate(1900px,-40px)}}
  .prog-bg{fill:rgba(0,0,0,.28)}
  :root[data-theme="day"] .prog-bg{fill:rgba(18,48,71,.18)}

  :root[data-theme="day"] .beam{display:none}
  :root[data-theme="day"] #litwindows{opacity:.28}
  :root[data-theme="day"] .orb{filter:drop-shadow(0 0 40px var(--orb-glow))}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="claudrunner status">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sky-1)"/>
      <stop offset=".62" stop-color="var(--sky-2)"/>
      <stop offset="1" stop-color="var(--sky-3)"/>
    </linearGradient>
    <linearGradient id="beamgrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="var(--hazard)" stop-opacity=".34"/>
      <stop offset="1" stop-color="var(--hazard)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun or moon -->
  <g class="orb"><circle cx="1290" cy="150" r="54" fill="var(--orb)"/></g>
  <g class="stars" fill="#fff">
    <g id="starfield"></g>
  </g>

  <!-- clouds (day) / high haze (night) -->
  <g opacity=".55" fill="var(--far)">
    <g class="cloud"><ellipse cx="200" cy="140" rx="86" ry="26"/><ellipse cx="250" cy="126" rx="58" ry="24"/></g>
    <g class="cloud b"><ellipse cx="700" cy="96" rx="104" ry="24"/><ellipse cx="760" cy="84" rx="62" ry="22"/></g>
    <g class="cloud c"><ellipse cx="1100" cy="190" rx="74" ry="20"/><ellipse cx="1146" cy="180" rx="48" ry="18"/></g>
  </g>

  <!-- a little plane, because the sky was empty -->
  <g class="plane" opacity=".8"><g transform="translate(0,120)">
    <path d="M0,0 l34,0 l10,-9 l9,0 l-4,9 l17,0 l9,-8 l7,0 l-4,8 l12,2 l-12,2 l4,8 l-7,0 l-9,-8 l-17,0 l4,9 l-9,0 l-10,-9 l-34,0 z"
          fill="var(--body-2)"/></g></g>

  <!-- far skyline -->
  <g fill="var(--far)">
    <path d="M0,560 L0,430 90,430 90,470 180,470 180,380 270,380 270,450 360,450 360,400 470,400
             470,470 560,470 560,360 650,360 650,440 760,440 760,410 870,410 870,470 980,470
             980,390 1080,390 1080,450 1190,450 1190,420 1300,420 1300,470 1420,470 1420,430
             1600,430 1600,560 Z"/>
  </g>
  <!-- mid skyline -->
  <g fill="var(--mid)">
    <path d="M0,620 L0,500 120,500 120,540 240,540 240,470 360,470 360,530 500,530 500,490
             640,490 640,550 780,550 780,500 920,500 920,545 1060,545 1060,480 1200,480
             1200,540 1340,540 1340,510 1600,510 1600,620 Z"/>
    <g id="litwindows" fill="var(--hazard)" opacity=".85"></g>
  </g>
  <!-- near buildings -->
  <g fill="var(--near)">
    <path d="M0,770 L0,640 150,640 150,690 300,690 300,620 430,620 430,700 600,700 600,660
             1000,660 1000,712 1160,712 1160,644 1330,644 1330,700 1600,700 1600,770 Z"/>
  </g>

  <!-- ground -->
  <rect y="762" width="1600" height="138" fill="var(--ground)"/>
  <rect y="762" width="1600" height="12" fill="var(--ground-top)"/>
  <g opacity=".35" stroke="var(--ground-top)" stroke-width="4" stroke-dasharray="34 30">
    <line x1="0" y1="820" x2="1600" y2="820"/></g>

  <!-- a car on the near road -->
  <g class="car"><g transform="translate(0,748)">
    <rect x="0" y="-16" width="62" height="16" rx="7" fill="var(--hazard)"/>
    <rect x="12" y="-26" width="30" height="12" rx="5" fill="var(--body-2)"/>
    <circle cx="14" cy="2" r="6" fill="var(--ink)"/><circle cx="48" cy="2" r="6" fill="var(--ink)"/>
  </g></g>

  <!-- the hero, on a crate stack at the right -->
  <g id="hero" transform="translate(1350,762)">
    <g class="beam" opacity=".7"><path d="M-70,0 L10,-560 90,-560 40,0 Z" fill="url(#beamgrad)"/></g>
    <rect x="-56" y="-46" width="112" height="46" rx="6" fill="var(--near)"/>
    <rect x="-40" y="-84" width="80" height="40" rx="6" fill="var(--mid)"/>
    <g class="bob" transform="translate(0,-84)">
      <path class="cape" d="M-18,-70 q-26,42 -20,70 l14,0 q-6,-38 10,-60 z" fill="var(--hazard)" opacity=".95"/>
      <rect x="-20" y="-72" width="40" height="50" rx="12" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <path d="M0,-56 l9,13 -9,13 -9,-13 z" fill="var(--hazard)"/>
      <rect x="-19" y="-104" width="38" height="34" rx="11" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <rect class="visor" x="-12" y="-94" width="24" height="9" rx="4.5" fill="var(--neon)"/>
      <rect x="-13" y="-22" width="11" height="22" rx="5" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="2" y="-22" width="11" height="22" rx="5" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="-30" y="-68" width="11" height="30" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="19" y="-68" width="11" height="30" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
    </g>
  </g>

  <!-- workers and idle props are built here -->
  <g id="crew"></g>

  <!-- foreground: a plant and a crate, for depth -->
  <g transform="translate(1520,762)" opacity=".9">
    <path d="M0,0 l-10,-40 q16,-26 26,-6 q18,-16 22,10 l-8,36 z" fill="var(--near)"/>
  </g>
  <g transform="translate(110,762)">
    <rect x="-26" y="-34" width="52" height="34" rx="5" fill="var(--mid)" stroke="var(--ink)" stroke-width="2.5" opacity=".9"/>
    <path d="M-26,-22 L26,-22" stroke="var(--ink)" stroke-width="2.5" opacity=".9"/>
  </g>
</svg>

<div class="hud">
  <span class="brand">claud<b>runner</b></span>
  <span class="chip" id="mode">LIVE</span>
  <span class="spacer"></span>
  <span class="chip">QUEUE <b id="q">0</b></span>
  <span class="chip">SHIPPED <b id="r">0</b></span>
  <button id="theme">☾ NIGHT</button>
  <button id="tasks">TASKS ▸</button>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <h2>Units in the field</h2>
  <div id="list"></div>
</aside>

<script>
const params = new URLSearchParams(location.search);
const DATA_URL = params.get('data') || 'status.json';
const POLL_MS  = Number(params.get('poll') || 10000);
const el = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const node = (n, a = {}) => { const e = document.createElementNS(SVGNS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

// ---------------------------------------------------------------- theme
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  el('theme').textContent = t === 'day' ? '☀ DAY' : '☾ NIGHT';
  try { localStorage.setItem('cr-theme', t); } catch {}
}
let theme = params.get('theme');
if (!theme) { try { theme = localStorage.getItem('cr-theme'); } catch {} }
if (!theme) { const h = new Date().getHours(); theme = (h >= 7 && h < 19) ? 'day' : 'night'; }
setTheme(theme);
el('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'day' ? 'night' : 'day');

// ---------------------------------------------------------------- drawer
el('tasks').onclick = () => {
  const d = el('drawer'); const open = d.classList.toggle('open');
  d.setAttribute('aria-hidden', String(!open));
  el('tasks').textContent = open ? 'TASKS ◂' : 'TASKS ▸';
};
addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') el('tasks').click(); });

// ---------------------------------------------------------------- starfield
(() => {
  const g = el('starfield');
  for (let i = 0; i < 90; i++) {
    const s = node('circle', { cx: Math.round(Math.random() * 1600), cy: Math.round(Math.random() * 420),
      r: (Math.random() * 1.6 + .6).toFixed(1), opacity: (Math.random() * .7 + .3).toFixed(2) });
    if (Math.random() < .3) { s.setAttribute('class', 'twinkle');
      s.style.animationDelay = (Math.random() * 3.4).toFixed(2) + 's'; }
    g.appendChild(s);
  }
  const w = el('litwindows');
  for (let i = 0; i < 70; i++) {
    w.appendChild(node('rect', { x: Math.round(Math.random() * 1590), y: Math.round(490 + Math.random() * 60),
      width: 4, height: 6, opacity: (Math.random() * .8 + .2).toFixed(2) }));
  }
})();

// ---------------------------------------------------------------- the crew
// One robot per active run, at its own bench. Idle robots sit down instead.
function robot(x, phase, title, progress) {
  const g = node('g', { transform: `translate(${x},762)` });
  const review = /review/i.test(phase || '');
  const accent = review ? 'var(--neon)' : 'var(--hazard)';

  g.innerHTML = `
    <ellipse cx="0" cy="2" rx="46" ry="7" fill="rgba(0,0,0,.20)"/>
    <g class="bob">
      <rect x="-24" y="-62" width="48" height="44" rx="13" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <path d="M0,-46 l9,11 -9,11 -9,-11 z" fill="${accent}"/>
      <rect x="-22" y="-98" width="44" height="38" rx="12" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <rect class="visor" x="-13" y="-86" width="26" height="10" rx="5" fill="${accent}"/>
      <rect x="-2" y="-112" width="4" height="15" fill="var(--trim)"/>
      <circle cx="0" cy="-114" r="5" fill="${accent}"/>
      <rect x="-16" y="-18" width="13" height="18" rx="6" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="3" y="-18" width="13" height="18" rx="6" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2.5"/>
      <g class="hammer">
        <rect x="22" y="-58" width="12" height="30" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
        <rect x="24" y="-34" width="8" height="22" rx="3" fill="var(--trim)"/>
        <rect x="16" y="-16" width="26" height="12" rx="3" fill="var(--ink)"/>
      </g>
      <rect x="-34" y="-58" width="12" height="30" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
    </g>
    <rect x="34" y="-16" width="62" height="16" rx="4" fill="var(--mid)" stroke="var(--ink)" stroke-width="2.5"/>
    <g class="spark" fill="${accent}"><circle cx="46" cy="-18" r="3"/><circle cx="54" cy="-22" r="2"/></g>
    <g transform="translate(0,-150)">
      <rect class="prog-bg" x="-96" y="-30" width="192" height="44" rx="10"/>
      <text x="0" y="-12" text-anchor="middle" font-size="12" fill="var(--text)"
            font-family="var(--mono)" letter-spacing="0.5">${(title || '').slice(0, 26)}</text>
      <rect x="-80" y="-2" width="160" height="8" rx="4" fill="rgba(255,255,255,.25)"/>
      <rect x="-80" y="-2" width="${Math.max(4, Math.round((progress || 0) * 160))}" height="8" rx="4" fill="${accent}"/>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="var(--muted)"
            font-family="var(--mono)" letter-spacing="2">${(phase || 'WORKING').toUpperCase()}</text>
    </g>`;
  return g;
}

function idleRobot(x, flip) {
  const g = node('g', { transform: `translate(${x},762) scale(${flip ? -1 : 1},1)` });
  g.innerHTML = `
    <ellipse cx="0" cy="2" rx="42" ry="7" fill="rgba(0,0,0,.20)"/>
    <rect x="-52" y="-40" width="104" height="40" rx="10" fill="var(--mid)" stroke="var(--ink)" stroke-width="3"/>
    <g class="bob">
      <rect x="-22" y="-78" width="44" height="40" rx="12" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <rect x="-20" y="-112" width="40" height="36" rx="12" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <rect class="visor" x="-12" y="-100" width="24" height="9" rx="4.5" fill="var(--neon)"/>
      <rect x="24" y="-72" width="12" height="26" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
      <g transform="translate(40,-48)">
        <rect x="-9" y="-12" width="18" height="15" rx="4" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2"/>
        <path class="steam" d="M0,-16 q7,-9 0,-18" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
    <g class="zzz" fill="var(--muted)" font-family="var(--mono)" font-size="15">
      <text x="26" y="-118">z</text></g>`;
  return g;
}

// ---------------------------------------------------------------- quips
const QUIPS = {
  work: ['SOMEBODY CALLED THIS IN A LOOP AND WENT HOME.',
         'THE BUG WAS COMING FROM INSIDE THE REPO.',
         'I CANNOT FLY. I CAN OPEN A PULL REQUEST.',
         'THIS FUNCTION HAS FOUR RESPONSIBILITIES. I COUNTED.',
         'WITH GREAT ACCESS COMES A VERY SHORT ALLOWLIST.'],
  idle: ['QUEUE EMPTY. I HAVE READ THE README TWICE.',
         'NOBODY HAS PUSHED IN A WHILE. I AM FINE.',
         'THE COFFEE IS DECORATIVE. I APPRECIATE THE GESTURE.',
         'I COULD REFACTOR SOMETHING. I WAS NOT ASKED TO.',
         'MY ONE WEAKNESS: A CARD WITH NO ACCEPTANCE CRITERIA.']
};
const pick = a => a[Math.floor(Math.random() * a.length)];
let bubble, bubbleTimer;
function say(text) {
  bubble?.remove(); clearTimeout(bubbleTimer);
  bubble = document.createElement('div');
  bubble.className = 'say'; bubble.textContent = text;
  document.body.appendChild(bubble);
  bubbleTimer = setTimeout(() => bubble?.remove(), 8000);
}

// ---------------------------------------------------------------- render
let lastShipped = 0;
function render(d, live) {
  const runs = (d.runs || []).slice(0, 4);
  const idle = !runs.length;
  document.documentElement.dataset.idle = idle ? '1' : '0';

  el('mode').textContent = live ? 'LIVE' : 'SIMULATION';
  el('q').textContent = d.queue ?? 0;
  el('r').textContent = d.retired_today ?? 0;

  const crew = el('crew'); crew.textContent = '';
  if (idle) {
    crew.appendChild(idleRobot(430, false));
    crew.appendChild(idleRobot(620, true));
  } else {
    const step = 1100 / (runs.length + 1);
    runs.forEach((r, i) => crew.appendChild(
      robot(Math.round(160 + step * (i + 1)), r.phase, r.title || r.id, r.progress)));
  }

  const list = el('list');
  list.innerHTML = runs.length ? '' : '<div class="none">Nothing in the field. The queue is quiet.</div>';
  for (const r of runs) {
    const div = document.createElement('div');
    div.className = 'task' + (/review/i.test(r.phase || '') ? ' review' : '');
    div.innerHTML = `<div class="t"><span class="n"></span><span class="p"></span></div>
      <div class="m"></div><div class="bar"><i style="width:${Math.round((r.progress || 0) * 100)}%"></i></div>`;
    div.querySelector('.n').textContent = r.title || r.id;
    div.querySelector('.p').textContent = (r.phase || 'working').toUpperCase();
    div.querySelector('.m').textContent = `${r.id}${r.board ? ' · ' + r.board : ''}`;
    list.appendChild(div);
  }

  if ((d.retired_today || 0) > lastShipped) say(pick(QUIPS.work));
  lastShipped = d.retired_today || 0;
}

// ---------------------------------------------------------------- data
const PHASES = ['selecting', 'implementing', 'testing', 'review', 'shipping'];
const TITLES = ['Stream the CSV export', 'Tenant id read from the URL',
                'Retry handler double-charges', 'Nightly rollup locks the table',
                'Cache key ignores the locale'];
let sim = { shipped: 2, runs: [{ id: '#412', title: TITLES[0], phase: 'implementing',
  progress: .3, board: 'github' }] };
function simulate() {
  for (const r of sim.runs) {
    r.progress = Math.min(1, r.progress + .04);
    r.phase = PHASES[Math.min(4, Math.floor(r.progress * 5))];
  }
  if (sim.runs[0] && sim.runs[0].progress >= 1) { sim.runs.shift(); sim.shipped++; }
  if (sim.runs.length < 3 && Math.random() < .5) {
    const taken = sim.runs.map(r => r.title);
    const free = TITLES.filter(t => !taken.includes(t));
    if (free.length) sim.runs.push({ id: '#' + (400 + Math.floor(Math.random() * 99)),
      title: pick(free), phase: 'selecting', progress: 0, board: 'github' });
  }
  return { queue: 2, retired_today: sim.shipped, runs: sim.runs };
}

async function poll() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    render(await res.json(), true);
  } catch { render(simulate(), false); }
}
poll(); setInterval(poll, POLL_MS);
setInterval(() => {
  if (Math.random() < .55) say(pick(document.documentElement.dataset.idle === '1' ? QUIPS.idle : QUIPS.work));
}, 24000);
</script>
