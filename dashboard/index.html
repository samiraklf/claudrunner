<!doctype html>
<html lang="en" data-theme="night" data-idle="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>claudrunner</title>
<style>
  :root{
    --hazard:#ff8a2b; --neon:#35e0e0; --ok:#5ddc8a; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  /* NIGHT ------------------------------------------------------------------ */
  :root[data-theme="night"]{
    --sky-1:#0b1430; --sky-2:#152a53; --sky-3:#2b3f6b;
    --far:#1b2a4d; --mid:#16233f; --near:#101a30;
    --ground:#0d1526; --ground-top:#1b2b47;
    --ink:#050912; --body:#e4ecf8; --body-2:#b9c8de; --trim:#7d93b5;
    --text:#dbe6f5; --muted:#8fa3c0; --panel:rgba(10,17,30,.9);
    --orb:#f4f1e4; --orb-glow:rgba(244,241,228,.30); --star:1;
  }
  /* DAY -------------------------------------------------------------------- */
  :root[data-theme="day"]{
    --sky-1:#8fd3f4; --sky-2:#cfeaf7; --sky-3:#ffe9c9;
    --far:#a9c8dd; --mid:#7fa6c4; --near:#5b82a6; --ground:#7cc08a; --ground-top:#96d69f;
    --ink:#123047; --body:#ffffff; --body-2:#dbe6f2; --trim:#3d6180;
    --text:#123047; --muted:#40658a; --panel:rgba(255,255,255,.92);
    --orb:#fff3b0; --orb-glow:rgba(255,222,120,.55); --star:0;
  }
  /* per-scene overrides, layered on top of the day/night palette */
  :root[data-scene="beach"][data-theme="day"]{--sky-1:#7fd0f0;--sky-2:#cfeff7;--sky-3:#ffe6b8;
    --far:#93c9d8;--mid:#3fa3bd;--near:#2b86a3;--ground:#f0d9a7;--ground-top:#ffeec4}
  :root[data-scene="beach"][data-theme="night"]{--sky-1:#0a1730;--sky-2:#10304f;--sky-3:#1d4a63;
    --far:#12354f;--mid:#0f3d54;--near:#0b2c3f;--ground:#2a2740;--ground-top:#3b3757}
  :root[data-scene="space"][data-theme="day"]{--sky-1:#1a1040;--sky-2:#3a1f63;--sky-3:#6b3a7a;
    --far:#43305e;--mid:#33254a;--near:#261b38;--ground:#6e6480;--ground-top:#8a7e9c;--star:1}
  :root[data-scene="maze"][data-theme="day"]{--sky-1:#cfe3ef;--sky-2:#e7f0f3;--sky-3:#dfe6dc;
    --far:#8d9a8a;--mid:#6f7d6e;--near:#57624f;--ground:#6a6a5c;--ground-top:#7d7d6c}
  :root[data-scene="maze"][data-theme="night"]{--sky-1:#0a1018;--sky-2:#121c24;--sky-3:#1b2a2a;
    --far:#25352c;--mid:#1b2a23;--near:#131e19;--ground:#20241f;--ground-top:#2e342b}
  :root[data-scene="space"][data-theme="night"]{--sky-1:#05030f;--sky-2:#0c0a22;--sky-3:#141033;
    --far:#1c1636;--mid:#141029;--near:#0d0a1d;--ground:#2a2540;--ground-top:#3b3457;--star:1}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--sky-1);color:var(--text);font:13px/1.5 var(--mono)}
  svg#stage{position:fixed;inset:0;width:100%;height:100%}

  /* ---- HUD --------------------------------------------------------------- */
  .hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;
    gap:18px;padding:14px 18px;pointer-events:none}
  .hud > *{pointer-events:auto}
  .brand{font-size:15px;letter-spacing:.4em;text-transform:uppercase;font-weight:700;
    color:var(--text);text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .brand b{color:var(--hazard)}
  .chip{font-size:11px;letter-spacing:.16em;padding:5px 10px;border-radius:99px;
    background:var(--panel);color:var(--muted);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .chip b{color:var(--text)}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:6px 14px;
    background:var(--panel);color:var(--text);letter-spacing:.14em;font-size:11px;
    box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .12s ease}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px)}

  /* ---- task drawer, hidden by default ------------------------------------ */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:6;
    background:var(--panel);backdrop-filter:blur(10px);padding:66px 18px 18px;
    transform:translateX(102%);transition:transform .32s cubic-bezier(.3,.9,.3,1);
    box-shadow:-20px 0 60px -30px #000;overflow:auto}
  .drawer.open{transform:none}
  .drawer h2{font-size:10px;letter-spacing:.3em;color:var(--muted);margin:0 0 12px;
    text-transform:uppercase;font-weight:500}
  .task{padding:11px 12px;border-radius:8px;margin-bottom:9px;
    background:rgba(127,127,127,.10);box-shadow:inset 3px 0 0 var(--hazard)}
  .task.review{box-shadow:inset 3px 0 0 var(--neon)}
  .task .t{display:flex;gap:8px;align-items:baseline}
  .task .n{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .p{font-size:10px;letter-spacing:.16em;color:var(--hazard)}
  .task.review .p{color:var(--neon)}
  .task .m{font-size:11px;color:var(--muted);margin-top:2px}
  .bar{height:6px;border-radius:99px;background:rgba(127,127,127,.22);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--hazard);transition:width .6s ease}
  .task.review .bar i{background:var(--neon)}
  .none{color:var(--muted);text-align:center;padding:28px 0}

  /* ---- name tag on hover ------------------------------------------------ */
  .nametag{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,calc(-100% - 18px));
    background:var(--panel);color:var(--text);padding:8px 13px;border-radius:12px;text-align:center;
    box-shadow:0 5px 0 rgba(0,0,0,.16);animation:pop .22s cubic-bezier(.2,1.3,.4,1);white-space:nowrap}
  .nametag b{display:block;font-size:14px;letter-spacing:.14em;color:var(--hazard)}
  .nametag span{display:block;font-size:10px;letter-spacing:.06em;color:var(--muted);margin-top:1px}
  .nametag i{display:block;font-style:normal;font-size:12px;margin-top:7px;max-width:280px;
    white-space:normal;line-height:1.35;color:var(--text)}
  .nametag i:before{content:"💭 "}
  .nametag:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;
    border:7px solid transparent;border-top-color:var(--panel);border-bottom:0}
  [data-who]{cursor:pointer}

  /* ---- speech ------------------------------------------------------------ */
  .say{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:4;
    background:var(--panel);color:var(--text);font-size:12px;letter-spacing:.06em;
    padding:10px 16px;border-radius:14px;max-width:min(620px,86vw);text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.16);animation:pop .34s cubic-bezier(.2,1.3,.4,1)}
  .say:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;
    border:8px solid transparent;border-top-color:var(--panel);border-bottom:0}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px) scale(.94)}}

  /* ---- scene motion ------------------------------------------------------ */
  .cloud{animation:drift 90s linear infinite}
  .cloud.b{animation-duration:140s;animation-delay:-40s}
  .cloud.c{animation-duration:190s;animation-delay:-90s}
  @keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1900px)}}
  .stars{opacity:var(--star);transition:opacity .6s ease}
  .twinkle{animation:tw 3.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .orb{filter:drop-shadow(0 0 26px var(--orb-glow))}
  .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .hammer{animation:hammer .62s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 20%}
  @keyframes hammer{0%,100%{transform:rotate(-8deg)}45%{transform:rotate(46deg)}}
  .spark{animation:spark .62s ease-in-out infinite}
  @keyframes spark{0%,48%{opacity:0;transform:translate(0,0) scale(.6)}
    52%{opacity:1}100%{opacity:0;transform:translate(14px,-18px) scale(1.2)}}
  .cape{animation:cape 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes cape{0%,100%{transform:skewX(0)}50%{transform:skewX(-11deg)}}
  .beam{animation:beam 5s ease-in-out infinite}
  @keyframes beam{0%,100%{opacity:.5}50%{opacity:.95}}
  .steam{animation:steam 3s ease-in-out infinite}
  @keyframes steam{0%{opacity:0;transform:translateY(0)}35%{opacity:.75}100%{opacity:0;transform:translateY(-22px)}}
  .zzz{animation:zzz 4s ease-in-out infinite}
  @keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.7)}
    30%{opacity:.9}100%{opacity:0;transform:translate(18px,-34px) scale(1.15)}}
  .visor{animation:blink 6s steps(1) infinite}
  @keyframes blink{0%,96%{opacity:1}97%,99%{opacity:.25}}
  .car{animation:car 22s linear infinite}
  @keyframes car{from{transform:translateX(-260px)}to{transform:translateX(1860px)}}
  .plane{animation:plane 40s linear infinite}
  @keyframes plane{from{transform:translate(-300px,0)}to{transform:translate(1900px,-40px)}}
  .prog-bg{fill:rgba(6,12,24,.66)}
  .track{fill:rgba(255,255,255,.22)}
  :root[data-theme="day"] .track{fill:rgba(18,48,71,.16)}
  :root[data-theme="day"] .prog-bg{fill:rgba(255,255,255,.82)}

  .backdrop{display:none}
  :root[data-scene="city"]  #sc-city,
  :root[data-scene="beach"] #sc-beach,
  :root[data-scene="space"] #sc-space,
  :root[data-scene="maze"]  #sc-maze{display:block}
  :root[data-scene="space"] .cloud,
  :root[data-scene="space"] .plane,
  :root[data-scene="space"] .car{display:none}
  :root[data-scene="space"] .stars{opacity:1}
  #city-props,#city-fg,#city-road,#city-shop,#maze-floor{display:none}
  :root[data-scene="maze"] #maze-floor{display:block}
  :root[data-scene="city"] .car,
  :root[data-scene="city"] #city-road,
  :root[data-scene="city"] #city-shop,
  :root[data-scene="city"] #city-props,
  :root[data-scene="city"] #city-fg{display:block}
  :root[data-scene="beach"] .car,
  :root[data-scene="beach"] .road,
  :root[data-scene="space"] .road,
  :root[data-scene="maze"] .road,
  :root[data-scene="maze"] .car,
  :root[data-scene="maze"] .plane,
  :root[data-scene="maze"] .cloud,
  :root[data-scene="maze"] .orb{display:none}
  .win{fill:var(--trim)}
  .win.on{fill:var(--hazard)}
  :root[data-theme="day"] .win{fill:#ffffff;opacity:.30!important}
  :root[data-theme="day"] .win.on{fill:#cfe3f2;opacity:.6!important}
  .blink{animation:blink2 1.8s steps(1) infinite}
  @keyframes blink2{0%,55%{opacity:1}56%,100%{opacity:.15}}
  .neon{animation:neon 4.5s steps(1) infinite}
  #shopsign{animation:neon 4.5s steps(1) infinite;filter:drop-shadow(0 0 6px var(--neon))}
  [data-idle="1"] #shopsign{fill:#ff6b6b;animation:none;filter:drop-shadow(0 0 6px #ff6b6b)}
  .shopwin{fill:#ffd27a;opacity:.9}
  :root[data-theme="day"] .shopwin{fill:#cfe3f2;opacity:.85}
  [data-idle="1"] .shopwin{fill:#1c1c26;opacity:.9}
  .upwin{fill:#ffd27a;opacity:.75}
  :root[data-theme="day"] .upwin{fill:#cfe3f2;opacity:.85}
  .walllamp{filter:drop-shadow(0 0 10px #ffd27a)}
  :root[data-theme="day"] .walllamp{filter:none;opacity:.6}
  [data-idle="1"] .shopstuff{opacity:.25}
  @keyframes neon{0%,88%{opacity:1}89%,91%{opacity:.25}92%,96%{opacity:1}97%,99%{opacity:.3}}
  .lamp{filter:drop-shadow(0 0 16px var(--hazard))}
  /* the swing: across the sky on a line, then gone for a while */
  .swinger{animation:swingby 20s ease-in-out infinite}
  @keyframes swingby{
    0%{transform:translate(-160px,300px);opacity:0}
    5%{opacity:1}
    24%{transform:translate(520px,440px)}
    46%{transform:translate(1180px,310px)}
    70%{transform:translate(1760px,410px);opacity:1}
    72%,100%{transform:translate(1760px,410px);opacity:0}}
  .swing{animation:pend 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes pend{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
  .birds{animation:birds 46s linear infinite}
  @keyframes birds{from{transform:translate(-80px,250px)}to{transform:translate(1700px,190px)}}
  .gull{animation:gull 34s linear infinite}
  @keyframes gull{from{transform:translate(1700px,300px)}to{transform:translate(-90px,240px)}}
  .glitter{animation:glit 4s ease-in-out infinite}
  @keyframes glit{0%,100%{opacity:.25}50%{opacity:.7}}
  .ball{animation:ball 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes ball{0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-58px) rotate(180deg)}}
  .crab{animation:crab 19s ease-in-out infinite}
  @keyframes crab{0%{transform:translate(1340px,762px)}50%{transform:translate(1500px,762px) scaleX(-1)}
    100%{transform:translate(1340px,762px)}}
  .rock{animation:rock 60s linear infinite}
  @keyframes rock{from{transform:translate(-140px,240px) rotate(0)}
    to{transform:translate(1740px,300px) rotate(360deg)}}
  .rocket{animation:launch 26s ease-in infinite}
  @keyframes launch{0%,62%{transform:translate(120px,762px)}
    100%{transform:translate(190px,-300px)}}
  .flame{animation:flame .18s steps(2) infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes flame{0%{transform:scaleY(1)}100%{transform:scaleY(1.5)}}
  .flag{animation:flag 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
  @keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-7deg)}}
  .gatelight{animation:shaft 9s ease-in-out infinite}
  .shaft{animation:shaft 9s ease-in-out infinite}
  @keyframes shaft{0%,100%{opacity:.05}50%{opacity:.11}}
  .motes{animation:motes 14s ease-in-out infinite}
  @keyframes motes{0%{transform:translateY(0);opacity:.2}50%{opacity:.5}
    100%{transform:translateY(-60px);opacity:.15}}
  .lurk{animation:lurk 17s ease-in-out infinite}
  @keyframes lurk{0%,70%{transform:translateY(150px);opacity:0}
    80%{transform:translateY(0);opacity:1}92%{transform:translateY(0);opacity:1}
    100%{transform:translateY(150px);opacity:0}}
  .wave{animation:wave 7s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
  .palm{animation:palm 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes palm{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  .sat{animation:sat 34s linear infinite}
  @keyframes sat{from{transform:translate(-200px,60px)}to{transform:translate(1800px,-20px)}}
  :root[data-theme="day"] .beam,
  :root:not([data-scene="city"]) .beam{display:none}
  :root[data-theme="day"] #litwindows{opacity:.28}
  :root[data-theme="day"] .orb{filter:drop-shadow(0 0 40px var(--orb-glow))}

  /* one-off acts, triggered on a random robot every so often */
  .act-jump{animation:jump .9s cubic-bezier(.3,1.4,.4,1) 1}
  @keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-52px)}
    55%{transform:translateY(0) scaleY(.88)}70%{transform:translateY(-10px)}}
  .act-spin{animation:spin 1.1s ease-in-out 1;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes spin{to{transform:rotate(360deg)}}
  .act-shrug{animation:shrug 1.4s ease-in-out 1;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes shrug{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}
    60%{transform:rotate(9deg)}}
  .act-faint{animation:faint 2.2s ease-in-out 1;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes faint{0%{transform:rotate(0)}30%{transform:rotate(-88deg)}
    72%{transform:rotate(-88deg)}100%{transform:rotate(0)}}
  /* four dances, one per unit, so a crew never moves in unison */
  .dance-a{animation:danceA 2.2s ease-in-out 2;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceA{0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-16px) rotate(-10deg)}75%{transform:translateY(-16px) rotate(10deg)}}
  .dance-b{animation:danceB 1.6s linear 3;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceB{0%,100%{transform:translateX(0) skewX(0)}
    25%{transform:translateX(-14px) skewX(7deg)}50%{transform:translateX(0) skewX(0)}
    75%{transform:translateX(14px) skewX(-7deg)}}
  .dance-c{animation:danceC 1.1s ease-in-out 4;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceC{0%,100%{transform:scaleY(1) translateY(0)}
    40%{transform:scaleY(.82) translateY(6px)}70%{transform:scaleY(1.08) translateY(-18px)}}
  .dance-d{animation:danceD 2.6s ease-in-out 2;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceD{0%,100%{transform:rotate(0) translateY(0)}
    20%{transform:rotate(-360deg) translateY(-8px)}
    60%{transform:rotate(-360deg) translateY(0)}
    80%{transform:rotate(-360deg) translateY(-22px)}}
  .unit .acc{fill:var(--hazard)}
  .unit.review .acc{fill:var(--neon)}
  .minisay{animation:mini 5.5s ease-out 1 forwards}
  @keyframes mini{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}
    86%{opacity:1}100%{opacity:0}}

  .pet{animation:trot 26s ease-in-out infinite}
  @keyframes trot{0%{transform:translate(240px,782px)}
    46%{transform:translate(1180px,782px)}50%{transform:translate(1180px,782px) scaleX(-1)}
    96%{transform:translate(260px,788px) scaleX(-1)}100%{transform:translate(240px,782px)}}
  .pet-bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .pet-hover{animation:hover 3s ease-in-out infinite}
  @keyframes hover{0%,100%{transform:translateY(-34px)}50%{transform:translateY(-52px)}}
  .pet-scut{animation:scut .32s steps(2) infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes scut{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}
  .tail{animation:tail .4s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
  @keyframes tail{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(20deg)}}

  /* the reviewer: looks around when idle, scans whoever is in review */
  .hero-body.lookout{animation:lookout 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes lookout{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}
    45%{transform:rotate(-7deg)}65%{transform:rotate(7deg)}85%{transform:rotate(7deg)}}
  .scan-cone{animation:scanpulse 1.6s ease-in-out infinite}
  @keyframes scanpulse{0%,100%{opacity:.16}50%{opacity:.34}}
  .scan-bar{animation:scanbar 1.4s ease-in-out infinite alternate}
  @keyframes scanbar{from{transform:translateY(0)}to{transform:translateY(96px)}}

  /* the maze chase */
  .runlegs .leg-a{animation:legA .26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .runlegs .leg-b{animation:legA .26s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  @keyframes legA{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
  .runlegs .arm-a{animation:legA .26s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  .crawl .gl1,.crawl .gl3{animation:gleg .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .crawl .gl2,.crawl .gl4{animation:gleg .22s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  @keyframes gleg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
  .geye{filter:drop-shadow(0 0 6px var(--hazard))}
  .shake{animation:shake .12s linear 8}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}

  /* the gag */
  [data-gag="1"] .swinger{display:none}
  :root:not([data-scene="city"]):not([data-scene="maze"]) #gag{display:none}
  .stk{animation:stk 1.5s ease-out infinite}
  @keyframes stk{0%{opacity:0;transform:translateY(6px)}30%{opacity:.95}100%{opacity:0;transform:translateY(-16px)}}
  .fly{animation:fly 1.1s linear infinite;transform-box:view-box}
  @keyframes fly{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-label="claudrunner status">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sky-1)"/>
      <stop offset=".62" stop-color="var(--sky-2)"/>
      <stop offset="1" stop-color="var(--sky-3)"/>
    </linearGradient>
    <linearGradient id="beamgrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="var(--hazard)" stop-opacity=".34"/>
      <stop offset="1" stop-color="var(--hazard)" stop-opacity="0"/>
    </linearGradient>
  </defs>

<script>
const params = new URLSearchParams(location.search);
const DATA_URL = params.get('data') || 'status.json';
const POLL_MS  = Number(params.get('poll') || 10000);
const el = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const node = (n, a = {}) => { const e = document.createElementNS(SVGNS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

// ---------------------------------------------------------------- theme
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  el('theme').textContent = t === 'day' ? '☀ DAY' : '☾ NIGHT';
  try { localStorage.setItem('cr-theme', t); } catch {}
}
let theme = params.get('theme');
if (!theme) { try { theme = localStorage.getItem('cr-theme'); } catch {} }
if (!theme) { const h = new Date().getHours(); theme = (h >= 7 && h < 19) ? 'day' : 'night'; }
setTheme(theme);
el('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'day' ? 'night' : 'day');

// ---------------------------------------------------------------- scene
const SCENES = [['city', '🌆 CITY'], ['beach', '🏝 BEACH'], ['space', '🌑 SPACE'], ['maze', '🧱 MAZE']];
function setScene(name) {
  const found = SCENES.find(x => x[0] === name) || SCENES[0];
  document.documentElement.dataset.scene = found[0];
  el('scene').textContent = found[1];
  try { localStorage.setItem('cr-scene', found[0]); } catch {}
}
let scene = params.get('scene');
if (!scene) { try { scene = localStorage.getItem('cr-scene'); } catch {} }
setScene(scene || 'city');
el('scene').onclick = () => {
  const i = SCENES.findIndex(x => x[0] === document.documentElement.dataset.scene);
  setScene(SCENES[(i + 1) % SCENES.length][0]);
  if (lastData) render(lastData, lastLive);
  say(pick(QUIPS[document.documentElement.dataset.scene] || QUIPS.work));
};

// ---------------------------------------------------------------- drawer
function drawer(open) {
  const d = el('drawer');
  d.classList.toggle('open', open);
  d.setAttribute('aria-hidden', String(!open));
  el('tasks').textContent = open ? 'TASKS ◂' : 'TASKS ▸';
}
el('tasks').onclick = e => { e.stopPropagation(); drawer(!el('drawer').classList.contains('open')); };

// Click anywhere outside the drawer closes it, which is what people expect from a panel
// that slid in over the scene.
addEventListener('pointerdown', e => {
  if (!el('drawer').classList.contains('open')) return;
  if (el('drawer').contains(e.target)) return;
  drawer(false);
});
addEventListener('keydown', e => {
  if (e.key === 't' || e.key === 'T') drawer(!el('drawer').classList.contains('open'));
  if (e.key === 'Escape') drawer(false);
});

// ---------------------------------------------------------------- skyline
// Buildings with real facades: window grids, rooftop clutter, and three depth layers.
// Seeded so the city is the same city every time you open the page.
let seed = 20260916;
const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

function buildLayer(id, { top, base, minW, maxW, fill, winW, winH, gapX, gapY, lit, roof }) {
  const g = el(id);
  for (let x = -40; x < 1640;) {
    const w = ri(minW, maxW);
    const h = ri(top[0], top[1]);
    const y = base - h;
    g.appendChild(node('rect', { x, y, width: w, height: h, fill }));
    // a lighter face on one side gives the block some volume
    g.appendChild(node('rect', { x, y, width: Math.min(9, w * .12), height: h,
      fill: 'var(--ground-top)', opacity: .18 }));
    g.appendChild(node('rect', { x, y, width: w, height: 5, fill: 'var(--ground-top)', opacity: .3 }));

    // window grid
    const cols = Math.floor((w - gapX) / (winW + gapX));
    const rows = Math.floor((h - gapY - 14) / (winH + gapY));
    const ox = x + (w - (cols * (winW + gapX) - gapX)) / 2;
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const on = rnd() < lit;
        g.appendChild(node('rect', {
          x: (ox + c * (winW + gapX)).toFixed(1),
          y: (y + 14 + r * (winH + gapY)).toFixed(1),
          width: winW, height: winH, rx: 1,
          class: on ? 'win on' : 'win',
          opacity: on ? (0.55 + rnd() * 0.45).toFixed(2) : 0.16
        }));
      }
    }

    // rooftop clutter
    if (roof && w > 60 && rnd() < .75) {
      const rx = x + ri(8, Math.max(9, w - 30));
      const k = ri(0, 2);
      if (k === 0) {                                   // water tank
        g.appendChild(node('rect', { x: rx, y: y - 20, width: 22, height: 20, rx: 3, fill }));
        g.appendChild(node('path', { d: `M${rx - 3},${y - 20} h28 l-14,-9 z`, fill }));
      } else if (k === 1) {                            // aerial with a red light
        g.appendChild(node('rect', { x: rx + 6, y: y - 34, width: 3, height: 34, fill }));
        g.appendChild(node('circle', { cx: rx + 7.5, cy: y - 36, r: 3.5, fill: '#ff5a5a',
          class: 'blink' }));
      } else {                                         // plant room
        g.appendChild(node('rect', { x: rx, y: y - 13, width: ri(18, 34), height: 13, fill }));
      }
    }
    x += w + ri(2, 12);
  }
}

buildLayer('sky-far',  { top: [170, 330], base: 604, minW: 46, maxW: 104, fill: 'var(--far)',
  winW: 4, winH: 5, gapX: 7, gapY: 9, lit: .22, roof: false });
buildLayer('sky-mid',  { top: [150, 300], base: 690, minW: 62, maxW: 132, fill: 'var(--mid)',
  winW: 6, winH: 7, gapX: 9, gapY: 12, lit: .3, roof: true });

(() => {
  const g = el('starfield');
  for (let i = 0; i < 90; i++) {
    const s = node('circle', { cx: Math.round(Math.random() * 1600), cy: Math.round(Math.random() * 420),
      r: (Math.random() * 1.6 + .6).toFixed(1), opacity: (Math.random() * .7 + .3).toFixed(2) });
    if (Math.random() < .3) { s.setAttribute('class', 'twinkle');
      s.style.animationDelay = (Math.random() * 3.4).toFixed(2) + 's'; }
    g.appendChild(s);
  }
})();

const COSTUME = {
  city: () => `<path d="M-26,-98 q26,-22 52,0 z" fill="var(--hazard)"/>
               <rect x="-30" y="-100" width="60" height="7" rx="3.5" fill="var(--hazard)"/>`,
  beach: () => `<rect x="-15" y="-88" width="30" height="8" rx="4" fill="#1d2b3c"/>

  space: () => `<circle cx="0" cy="-80" r="27" fill="#bfe6ff" opacity=".34"/>
                <circle cx="0" cy="-80" r="27" fill="none" stroke="var(--body-2)" stroke-width="3"/>
                <rect x="-34" y="-62" width="12" height="34" rx="5" fill="var(--body-2)"
                      stroke="var(--ink)" stroke-width="2.5"/>
                <circle cx="-9" cy="-88" r="7" fill="#ffffff" opacity=".5"/>`,
  maze: () => `<path d="M-27,-84 q6,-30 27,-30 q21,0 27,30 q-27,-14 -54,0 z" fill="#5d6b4e"/>
               <path d="M-24,-56 l48,22" stroke="#7a6a4a" stroke-width="7" stroke-linecap="round"/>`
};

function robot(x, phase, title, progress, index) {
  const g = node('g', { class: 'unit', 'data-i': index, transform: `translate(${x},762)` });

  g.innerHTML = `
    <ellipse cx="0" cy="2" rx="46" ry="7" fill="rgba(0,0,0,.20)"/>
    <g class="bob">
      <rect x="-24" y="-62" width="48" height="44" rx="13" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <path class="acc" d="M0,-46 l9,11 -9,11 -9,-11 z"/>

      <rect class="visor acc" x="-13" y="-86" width="26" height="10" rx="5"/>
      <rect x="-2" y="-112" width="4" height="15" fill="var(--trim)"/>
      <circle class="acc" cx="0" cy="-114" r="5"/>
      <rect x="-16" y="-18" width="13" height="18" rx="6" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="3" y="-18" width="13" height="18" rx="6" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2.5"/>
      <g class="hammer">
        <rect x="22" y="-58" width="12" height="30" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
        <rect x="24" y="-34" width="8" height="22" rx="3" fill="var(--trim)"/>

      </g>
      <rect x="-34" y="-58" width="12" height="30" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
      ${(COSTUME[document.documentElement.dataset.scene] || COSTUME.city)()}
    </g>
    <g>
      <rect x="28" y="-22" width="74" height="9" rx="3" fill="var(--mid)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="33" y="-13" width="7" height="13" fill="var(--near)"/>

  const label = clip(title, 30);

  const inner = w - 34;
  const done = Math.max(5, Math.round((progress || 0) * inner));
  return `<g transform="translate(0,-158)">
    <rect class="prog-bg" x="${-w / 2}" y="-36" width="${w}" height="66" rx="12"/>
    <text x="0" y="-16" text-anchor="middle" font-size="12" fill="var(--text)"
          font-family="var(--mono)">${label}</text>
    <rect class="track" x="${-inner / 2}" y="-6" width="${inner}" height="9" rx="4.5"/>
    <rect class="acc" x="${-inner / 2}" y="-6" width="${done}" height="9" rx="4.5"/>

  lastData = d; lastLive = live;

  const idle = !runs.length;
  document.documentElement.dataset.idle = idle ? '1' : '0';

  if (sign) sign.textContent = idle ? 'CLOSED' : 'OPEN';
  const doorSign = document.querySelector('.doorsign');
  if (doorSign) doorSign.textContent = idle ? 'CLOSED' : 'OPEN';

  el('mode').textContent = live ? 'LIVE' : 'SIMULATION';
  el('q').textContent = d.queue ?? 0;
  el('r').textContent = d.retired_today ?? 0;

  const crew = el('crew');
  const scene = document.documentElement.dataset.scene;
  const hc = el('hero-costume');
  hc.innerHTML = `<g transform="translate(0,-8) scale(.92)">${(COSTUME[scene] || COSTUME.city)()}</g>`;

  // A scene or idle change genuinely needs new art; anything else is updated in place.
  const shape = scene + (idle ? ':idle' : ':work');
  if (crew.dataset.shape !== shape) { crew.textContent = ''; crew.dataset.shape = shape; }

  if (idle) {
    if (!crew.querySelector('.idle')) {
      const a = idleRobot(430, false); a.classList.add('idle');
      const b = idleRobot(620, true);  b.classList.add('idle');
      crew.append(a, b);
    }
  } else {
    const step = 1100 / (runs.length + 1);
    const keep = new Set(runs.map(r => String(r.id)));
    crew.querySelectorAll('.unit').forEach(u => { if (!keep.has(u.dataset.id)) u.remove(); });
    runs.forEach((r, i) => {
      const x = Math.round(160 + step * (i + 1));
      let unit = crew.querySelector(`.unit[data-id="${CSS.escape(String(r.id))}"]`);
      if (!unit) {
        unit = robot(x, r.phase, r.title || r.id, r.progress, i);
        unit.dataset.id = String(r.id);
        crew.appendChild(unit);
      }
      updateUnit(unit, r, x, i);

  reviewScan();

  // the companion goes in last so it walks in front of the crew, and is made once per scene
  let pet = crew.querySelector('.pet');
  if (!pet) {
    pet = node('g', { class: 'pet' });   // position comes from the trot keyframes

  const list = el('list');

    div.querySelector('.n').textContent = r.title || r.id;
    div.querySelector('.p').textContent = (r.phase || 'working').toUpperCase();
    div.querySelector('.m').textContent = `${r.id}${r.board ? ' · ' + r.board : ''}`;
    list.appendChild(div);
  }

  if ((d.retired_today || 0) > lastShipped && lastShipped > 0) {
    if (runs.length) { say('SHIPPED. EVERYBODY DANCE.'); setTimeout(danceParty, 300); }
    else say(pick(['SHIPPED. THE LAST ONE. CLOCKING OFF.', 'THAT WAS THE LAST TICKET. COFFEE TIME.']));
  }
  lastShipped = d.retired_today || 0;
}

let sim = { shipped: 2, runs: [{ id: '#412', title: TITLES[0], phase: 'implementing',
  progress: .3, board: 'github' }] };
function simulate() {
  for (const r of sim.runs) {
    r.progress = Math.min(1, r.progress + .04);
    r.phase = PHASES[Math.min(4, Math.floor(r.progress * 5))];
  }
  if (sim.runs[0] && sim.runs[0].progress >= 1) { sim.runs.shift(); sim.shipped++; }
  if (sim.runs.length < 3 && Math.random() < .5) {
    const taken = sim.runs.map(r => r.title);
    const free = TITLES.filter(t => !taken.includes(t));
    if (free.length) sim.runs.push({ id: '#' + (400 + Math.floor(Math.random() * 99)),
      title: pick(free), phase: 'selecting', progress: 0, board: 'github' });
  }
  return { queue: 2, retired_today: sim.shipped, runs: sim.runs };
}

// ---------------------------------------------------------------- the gag
// The dog stops, does his business and walks off, pleased with himself. A masked figure swings
// in, webs it, and carries it off into the sky. Scripted on a small tween timeline so every
// beat lands in order; city only, and never under reduced motion.
const E = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const lerp = (a, b, t) => a + (b - a) * t;
// ?slow=4 plays the gag at a quarter speed, which is handy for checking every beat
const SLOW = Math.max(1, Number(params.get('slow')) || 1);
const wait = ms => new Promise(r => setTimeout(r, ms * SLOW));
function tween(ms, fn, ease = E.io) {
  ms *= SLOW;
  return new Promise(resolve => {
    const t0 = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t), t);
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

  <g stroke="#9ccc65" stroke-width="3" fill="none" stroke-linecap="round">
    <path class="stk" d="M-14,-36 q6,-6 0,-12 q-6,-6 0,-12"/>
    <path class="stk" style="animation-delay:.5s" d="M0,-42 q6,-6 0,-12 q-6,-6 0,-12"/>
    <path class="stk" style="animation-delay:1s" d="M14,-36 q6,-6 0,-12 q-6,-6 0,-12"/>
  </g>
  <g transform="translate(0,-34)"><g class="fly"><circle cx="24" cy="0" r="2.6" fill="#222"/>
    <ellipse cx="22" cy="-3" rx="3" ry="1.6" fill="#fff" opacity=".7"/></g></g>`;

const SPLAT = `<g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
  <path d="M0,-12 v-10 M9,-8 l7,-7 M-9,-8 l-7,-7 M12,2 h10 M-12,2 h-10"/></g>`;

// same figure as the ambient swinger, with the shooting hand at (27,12)
const SPIDEY = `<g class="body">
  <path d="M-3,-14 l-17,-22" stroke="#c9352f" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="0" cy="4" rx="11" ry="15" fill="#c9352f"/>
  <path d="M-9,10 q9,8 18,0 l3,20 -8,4 -5,-16 -5,16 -8,-4 z" fill="#2c4d9e"/>
  <path d="M8,2 l19,10" stroke="#c9352f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="0" cy="-15" r="10" fill="#c9352f"/>
  <path d="M-7,-18 q4,-5 7,-1 q-3,5 -7,1 z" fill="#ffffff"/>
  <path d="M7,-18 q-4,-5 -7,-1 q3,5 7,1 z" fill="#ffffff"/>
  <g stroke="#8f211d" stroke-width="1.1" opacity=".85" fill="none"><path d="M-11,0 h22 M-10,7 h20 M0,-9 v24"/></g>
</g>`;

let gagRunning = false;
async function poopGag() {
  const root = document.documentElement;
  if (gagRunning || root.dataset.scene !== 'city' || document.hidden) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pet = document.querySelector('#crew .pet');
  if (!pet) return;

  gagRunning = true;
  root.dataset.gag = '1';
  const layer = el('gag'); layer.textContent = '';
  const inner = pet.firstElementChild;
  const Y = 782, DX = 620, PX = DX - 46;       // where the dog stops, and where it lands
  const dog = (x, sx = 1, sy = 1, lift = 0) => {
    if (pet.isConnected) pet.setAttribute('transform', `translate(${x},${Y - lift}) scale(${sx},${sy})`);
  };

  try {
    // 1. the dog trots in
    pet.style.animation = 'none';
    await tween(2600, t => dog(lerp(-90, DX, t)), E.out);

    // 2. a sniff, a look around
    await tween(700, (t, raw) => dog(DX, 1, 1 - .05 * Math.sin(raw * Math.PI * 4)), E.lin);

    // 3. the squat, with a small determined wobble
    if (inner) inner.style.animation = 'none';
    await tween(600, t => dog(DX, 1 + .08 * t, 1 - .2 * t), E.out);
    await tween(900, (t, raw) => dog(DX + Math.sin(raw * 38) * 1.6, 1.08, .8), E.lin);

    // 4. plop
    const poop = node('g', { transform: `translate(${PX},${Y}) scale(0)` });
    poop.innerHTML = POOP;
    layer.appendChild(poop);
    await tween(560, t => poop.setAttribute('transform', `translate(${PX},${Y}) scale(${Math.max(0, E.back(t))})`), E.lin);

    // 5. stands up, very pleased, hops, and leaves without looking back
    await tween(320, t => dog(DX, lerp(1.08, 1, t), lerp(.8, 1.06, t)), E.out);
    await tween(420, (t, raw) => dog(DX, 1, 1, Math.sin(raw * Math.PI) * 26), E.lin);
    if (inner) inner.style.animation = '';
    say(pick(['SIR WIGGLEBUTT WOULD LIKE IT ON RECORD THAT THIS WAS NOT HIM.', 'SIR WIGGLEBUTT HAS LEFT A FEATURE REQUEST.', 'SIR WIGGLEBUTT IS DEPLOYING TO THE PAVEMENT.']));
    const dogLeaves = tween(3400, t => dog(lerp(DX, 1740, t)), E.lin);

    await wait(700);

    // 6. the swing in, on a line from somewhere above the rooftops
    const swingLine = node('line', { stroke: '#ffffff', 'stroke-width': 2.5, opacity: .8 });
    const webLine = node('line', { stroke: '#ffffff', 'stroke-width': 3.5, 'stroke-linecap': 'round' });
    const hero = node('g', { 'data-who': 'crawler' });
    hero.innerHTML = SPIDEY + '<rect x="-34" y="-46" width="72" height="96" fill="none" pointer-events="all"/>';
    layer.append(swingLine, webLine, hero);
    const HX = PX - 44, HY = 400, AX = PX + 40, AY = -80;
    const place = (x, y, r) => {
      hero.setAttribute('transform', `translate(${x},${y}) rotate(${r})`);
      swingLine.setAttribute('x1', x); swingLine.setAttribute('y1', y - 14);
      swingLine.setAttribute('x2', AX); swingLine.setAttribute('y2', AY);
    };
    await tween(2100, (t, raw) => place(lerp(-160, HX, t), lerp(120, HY, t) + Math.sin(raw * Math.PI) * 120, lerp(-42, 6, t)), E.io);
    await tween(700, (t, raw) => place(HX + Math.sin(raw * Math.PI * 2) * 12, HY, 10 * Math.cos(raw * Math.PI * 2)), E.lin);

    // 7. thwip
    const hx = HX + 27, hy = HY + 12;
    webLine.setAttribute('x1', hx); webLine.setAttribute('y1', hy);
    await tween(360, t => { webLine.setAttribute('x2', lerp(hx, PX, t)); webLine.setAttribute('y2', lerp(hy, Y - 16, t)); }, E.out);
    const splat = node('g', { transform: `translate(${PX},${Y - 16})` }); splat.innerHTML = SPLAT;
    layer.appendChild(splat);
    await tween(300, t => { splat.setAttribute('transform', `translate(${PX},${Y - 16}) scale(${.4 + t})`); splat.setAttribute('opacity', 1 - t); }, E.out);
    splat.remove();
    say(pick(['ANOTHER THREAT CLEARED. YOU ARE WELCOME, CITY.', 'THE STREETS ARE SAFE. FOR NOW.', 'NOT ON MY PAVEMENT.']));
    await wait(380);

    // 8. the yank: up, away, cargo swinging on the web below
    await tween(2600, (t, raw) => {
      const x = lerp(HX, 1780, t);
      const y = lerp(HY, 40, t) - Math.sin(raw * Math.PI) * 50;
      place(x, y, lerp(10, 34, t));
      const handX = x + 27, handY = y + 12;
      const reel = E.out(Math.min(1, raw * 2.4));          // first reel it off the ground
      const px = lerp(PX, handX - 8 + Math.sin(raw * 15) * 22, reel);
      const py = lerp(Y, handY + 120, reel);
      poop.setAttribute('transform', `translate(${px},${py}) rotate(${Math.sin(raw * 18) * 26 * reel})`);
      webLine.setAttribute('x1', handX); webLine.setAttribute('y1', handY);
      webLine.setAttribute('x2', px); webLine.setAttribute('y2', py - 16);
    }, E.io);

    await dogLeaves;
  } finally {
    layer.textContent = '';
    pet.style.animation = '';
    if (inner) inner.style.animation = '';
    delete root.dataset.gag;
    gagRunning = false;
  }
}

// ---------------------------------------------------------------- the maze chase
// The doors start closing. A runner bolts out of the gate with a map, and something with far too
// many legs comes after him. He trips. It looms over him — and hands the map back. It has notes.
const SPRINT = `
  <ellipse cx="0" cy="2" rx="24" ry="5" fill="rgba(0,0,0,.22)"/>
  <g class="leg-a"><rect x="-8" y="-28" width="9" height="28" rx="4" fill="#3f4a3a" stroke="var(--ink)" stroke-width="2.5"/></g>
  <g class="leg-b"><rect x="0" y="-28" width="9" height="28" rx="4" fill="#4b5745" stroke="var(--ink)" stroke-width="2.5"/></g>
  <rect x="-15" y="-64" width="30" height="40" rx="11" fill="#7d8c5f" stroke="var(--ink)" stroke-width="3"/>
  <path d="M-12,-60 L14,-30" stroke="#6a4e2f" stroke-width="5" stroke-linecap="round"/>
  <rect x="8" y="-38" width="14" height="12" rx="3" fill="#8a6a3f" stroke="var(--ink)" stroke-width="2"/>
  <g class="arm-a"><rect x="-4" y="-60" width="8" height="26" rx="4" fill="#7d8c5f" stroke="var(--ink)" stroke-width="2.5"/></g>
  <rect x="-13" y="-92" width="28" height="30" rx="11" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
  <path d="M-15,-78 q4,-26 17,-26 q16,0 17,22 q-12,-10 -34,4 z" fill="#5d6b4e" stroke="var(--ink)" stroke-width="2.5"/>
  <rect x="-2" y="-82" width="16" height="7" rx="3.5" fill="var(--hazard)"/>
  <g class="sprint-map"><rect x="16" y="-56" width="20" height="9" rx="4" fill="#f1e3b5" stroke="var(--ink)" stroke-width="2"/></g>`;

const CREEP = `
  <ellipse cx="0" cy="3" rx="64" ry="9" fill="rgba(0,0,0,.25)"/>
  <g stroke="#26282a" stroke-width="7" stroke-linecap="round" fill="none">
    <g class="gl1"><path d="M-34,-40 l-22,20 l-8,22"/></g>
    <g class="gl2"><path d="M-12,-44 l-10,24 l-12,22"/></g>
    <g class="gl3"><path d="M12,-44 l10,24 l12,22"/></g>
    <g class="gl4"><path d="M34,-40 l22,20 l8,22"/></g>
  </g>
  <path d="M-58,-52 q-30,-22 -18,-62 q6,-16 18,-6 q-10,26 10,48 z" fill="#35383a" stroke="var(--ink)" stroke-width="3"/>
  <path d="M-72,-118 l-6,-18 l12,12 z" fill="#c9c9c9" stroke="var(--ink)" stroke-width="2"/>
  <ellipse cx="0" cy="-52" rx="58" ry="30" fill="#3e4244" stroke="var(--ink)" stroke-width="3"/>
  <path d="M-40,-74 l6,-14 6,12 M-16,-80 l6,-15 6,13 M10,-80 l6,-15 6,13 M34,-74 l6,-14 6,12"
        fill="#2c2f31" stroke="var(--ink)" stroke-width="2"/>
  <ellipse cx="-10" cy="-44" rx="30" ry="10" fill="#4c5153" opacity=".6"/>
  <circle cx="48" cy="-54" r="22" fill="#474b4d" stroke="var(--ink)" stroke-width="3"/>
  <circle class="geye" cx="56" cy="-62" r="5" fill="var(--hazard)"/>
  <circle class="geye" cx="42" cy="-64" r="4" fill="var(--hazard)"/>
  <path d="M40,-42 l5,6 5,-6 5,6 5,-6" fill="none" stroke="#e8e8e8" stroke-width="2.5"/>
  <path d="M60,-36 q4,10 -2,16" fill="none" stroke="#9fc8d6" stroke-width="2.5" opacity=".8"/>
  <g class="creep-claw"><path d="M52,-34 l30,8 M82,-26 l10,-7 M82,-26 l10,5" stroke="#26282a"
     stroke-width="6" stroke-linecap="round" fill="none"/></g>`;

WHO.sprint = { name: 'Sprint', role: 'runner · maps the maze · always late', thoughts: [
  'day 47. the maze changed again. so did the requirements.',
  'i ran twelve miles today. the ticket is still in progress.',
  'every night the walls move. every morning the estimate doubles.',
  'the map is up to date. as of four minutes ago.' ] };
WHO.creep = { name: 'Scope Creep', role: 'lives in the maze · follows every project', thoughts: [
  'i am not a monster. i am a small change.',
  'while you are in there, could you also—',
  'i get bigger every time someone says "quick".',
  'have you considered adding a dark mode.',
  'i do not chase people. i just… keep up.' ] };

function worldSay(layer, x, y, text, ms = 2200) {
  const w = Math.min(420, 30 + text.length * 7.8);
  const b = node('g', { transform: `translate(${x},${y})` });
  b.innerHTML = `<rect class="prog-bg" x="${-w / 2}" y="-26" width="${w}" height="34" rx="10"/>
    <path class="prog-bg" d="M-8,8 l8,11 l8,-11 z"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700"
          font-family="var(--mono)" fill="var(--text)">${text}</text>`;
  layer.appendChild(b);
  setTimeout(() => b.remove(), ms * SLOW);
  return b;
}

function setDoors(f) {
  const l = el('door-l'), r = el('door-r');
  if (l) l.setAttribute('transform', `translate(736,0) scale(${f},1) translate(-736,0)`);
  if (r) r.setAttribute('transform', `translate(864,0) scale(${f},1) translate(-864,0)`);
}

async function mazeGag() {
  const root = document.documentElement;
  if (gagRunning || root.dataset.scene !== 'maze' || document.hidden) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  gagRunning = true;
  root.dataset.gag = '1';
  const layer = el('gag'); layer.textContent = '';
  const stage = el('stage');
  const FLOOR = 818;

  const sprint = node('g', { 'data-who': 'sprint' });
  const sprintBody = node('g', { class: 'runlegs' }); sprintBody.innerHTML = SPRINT;
  sprint.appendChild(sprintBody);
  const creep = node('g', { 'data-who': 'creep' });
  const creepBody = node('g', { class: 'crawl' }); creepBody.innerHTML = CREEP;
  creep.appendChild(creepBody);
  const put = (g, x, y, sc, flip = false, rot = 0) =>
    g.setAttribute('transform', `translate(${x},${y}) rotate(${rot}) scale(${flip ? -sc : sc},${sc})`);

  try {
    // 1. the walls begin to close
    stage.classList.add('shake');
    setTimeout(() => stage.classList.remove('shake'), 1000);
    say('THE WALLS ARE CLOSING!');
    await tween(1300, t => setDoors(t * .55), E.io);

    // 2. out of the gate: a runner, running left, towards us
    put(sprint, 800, 770, .45, true); layer.appendChild(sprint);
    const run1 = tween(1500, t => put(sprint, lerp(800, 560, t), lerp(770, FLOOR, t), lerp(.45, 1.05, t), true), E.lin);
    await wait(450);
    worldSay(layer, 560, FLOOR - 120, 'RUN! SCOPE CREEP IS LOOSE!', 1800);

    // 3. and after him, the thing
    put(creep, 800, 770, .35, true); layer.insertBefore(creep, sprint);
    const chase1 = tween(1600, t => put(creep, lerp(800, 760, t), lerp(770, FLOOR, t), lerp(.35, 1.1, t), true), E.lin);
    await Promise.all([run1, chase1]);

    // 4. across the floor
    const run2 = tween(1500, t => put(sprint, lerp(560, 300, t), FLOOR, 1.05, true), E.lin);
    const chase2 = tween(1500, t => put(creep, lerp(760, 470, t), FLOOR, 1.1, true), E.lin);
    await run2;

    // 5. he trips. the map goes flying.
    sprintBody.classList.remove('runlegs');
    const map = sprint.querySelector('.sprint-map'); map.remove();
    const flyingMap = node('g'); flyingMap.innerHTML = '<rect x="-10" y="-5" width="20" height="9" rx="4" fill="#f1e3b5" stroke="var(--ink)" stroke-width="2"/>';
    layer.appendChild(flyingMap);
    const mapFly = tween(700, (t, raw) => flyingMap.setAttribute('transform',
      `translate(${lerp(290, 380, t)},${FLOOR - 70 - Math.sin(raw * Math.PI) * 60 + raw * 64}) rotate(${raw * 540})`), E.lin);
    await tween(420, t => put(sprint, lerp(300, 262, t), FLOOR, 1.05, true, lerp(0, -84, t)), E.out);
    await Promise.all([chase2, mapFly]);

    // 6. it skids to a stop over him, and looms
    creepBody.classList.remove('crawl');
    await tween(260, (t, raw) => put(creep, 470 - Math.sin(raw * Math.PI) * 18, FLOOR, 1.1, true), E.out);
    await tween(700, t => put(creep, 470, FLOOR, lerp(1.1, 1.38, t), true), E.back);
    await wait(700);

    // 7. …and hands it back
    flyingMap.remove();
    const claw = creep.querySelector('.creep-claw');
    const held = node('g'); held.innerHTML = '<rect x="86" y="-33" width="20" height="9" rx="4" fill="#f1e3b5" stroke="var(--ink)" stroke-width="2"/>';
    claw.appendChild(held);
    worldSay(layer, 470, FLOOR - 190, 'YOU DROPPED YOUR MAP.', 1900);
    await wait(2000);
    worldSay(layer, 470, FLOOR - 190, 'ALSO. ONE MORE SMALL FEATURE.', 2100);
    await wait(2200);

    // 8. he faints properly this time
    await tween(300, t => put(sprint, 262, FLOOR, 1.05, true, lerp(-84, -92, t)), E.out);
    say('SPRINT HAS FAINTED. THE SPRINT IS OVER.');
    await wait(900);

    // 9. it puts the map down gently, and goes home
    held.remove();
    const leftMap = node('g', { transform: `translate(330,${FLOOR - 4})` });
    leftMap.innerHTML = '<rect x="-10" y="-5" width="20" height="9" rx="4" fill="#f1e3b5" stroke="var(--ink)" stroke-width="2"/>';
    layer.appendChild(leftMap);
    worldSay(layer, 470, FLOOR - 190, 'I JUST WANTED TO ADD A BUTTON.', 1800);
    await wait(1400);
    creepBody.classList.add('crawl');
    await tween(2200, t => put(creep, lerp(470, 800, t), lerp(FLOOR, 770, t), lerp(1.38, .35, t), false), E.io);
    creep.remove();
    await tween(1200, t => setDoors((1 - t) * .55), E.io);

    // 10. he comes round, picks up the map, and limps off to find out what the button does
    await tween(600, t => put(sprint, 262, FLOOR, 1.05, true, lerp(-92, 0, t)), E.back);
    leftMap.remove();
    sprintBody.classList.add('runlegs');
    await tween(1800, t => put(sprint, lerp(262, -120, t), FLOOR, 1.05, true), E.lin);
  } finally {
    layer.textContent = '';
    setDoors(0);
    stage.classList.remove('shake');
    delete root.dataset.gag;
    gagRunning = false;
  }
}

// P plays whichever scene's gag is on screen; the timer does the same.
function sceneGag() {
  const scene = document.documentElement.dataset.scene;
  if (scene === 'city') return poopGag();
  if (scene === 'maze') return mazeGag();
}
addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'P') sceneGag(); });

// Each time Crawler starts a new swing across the city, he may announce himself.
document.querySelector('.swinger')?.addEventListener('animationiteration', e => {
  if (e.animationName !== 'swingby') return;
  const root = document.documentElement;
  if (root.dataset.scene !== 'city' || root.dataset.gag === '1') return;
  if (Math.random() < .6) setTimeout(() => say(pick(SWING_SHOUTS)), 1400);
});

// Hover anyone with a name to see who they are and what they are thinking. The tag follows
// the pointer, since none of them stand still, and the thought changes on every new hover.
(() => {
  const tag = el('nametag');
  const stage = el('stage');
  let current = null;
  stage.addEventListener('pointerover', e => {
    const who = e.target.closest('[data-who]');
    if (!who || who === current) return;
    current = who;
    const w = WHO[who.dataset.who];
    tag.querySelector('b').textContent = w.name;
    tag.querySelector('span').textContent = w.role;
    tag.querySelector('i').textContent = pick(w.thoughts);
    tag.style.left = e.clientX + 'px';
    tag.style.top = e.clientY + 'px';
    tag.hidden = false;
  });
  addEventListener('pointermove', e => {
    if (tag.hidden) return;
    tag.style.left = e.clientX + 'px';
    tag.style.top = e.clientY + 'px';
  });
  stage.addEventListener('pointerout', e => {
    if (!current) return;
    if (e.relatedTarget && current.contains(e.relatedTarget)) return;
    current = null;
    tag.hidden = true;
  });
})();
setTimeout(sceneGag, 12000);
setInterval(sceneGag, 60000);
</script>
