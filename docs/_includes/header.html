<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="claudrunner home">
    <img src="{{ '/assets/favicon.svg' | relative_url }}" alt="" width="28" height="28">
    <span>claud<b>runner</b></span>
  </a>
  <nav class="main-nav" aria-label="Main">
    <a href="{{ '/guides/' | relative_url }}"{% if page.nav == 'guides' %} aria-current="page"{% endif %}>Guides</a>
    <a href="{{ '/getting-started/' | relative_url }}"{% if page.nav == 'docs' %} aria-current="page"{% endif %}>Docs</a>
    <a href="{{ '/demo/' | relative_url }}">Demo</a>
  </nav>
  <div class="tools">
    <button class="search-btn" type="button" data-search-open aria-label="Search the docs">
      {% include icon.html name="search" px=17 %}<span>Search</span><kbd>/</kbd>
    </button>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch between light and dark">
      <span class="when-light">{% include icon.html name="moon" px=18 %}</span>
      <span class="when-dark">{% include icon.html name="sun" px=18 %}</span>
    </button>
    <a class="icon-btn gh" href="https://github.com/{{ site.repository }}" aria-label="claudrunner on GitHub">{% include icon.html name="github" %}</a>
  </div>
</header>

<dialog class="search" aria-label="Search the docs">
  <form method="dialog" class="search-box" role="search">
    {% include icon.html name="search" px=18 %}
    <input type="search" placeholder="Search guides and docs…" aria-label="Search guides and docs" autocomplete="off" spellcheck="false">
    <button class="icon-btn" value="close" aria-label="Close search">{% include icon.html name="x" px=18 %}</button>
  </form>
  <ul class="results" aria-live="polite"></ul>
  <p class="search-hint"><kbd>↑</kbd><kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close</p>
</dialog>
