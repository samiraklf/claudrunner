<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<meta name="theme-color" content="#0b1430">
<script>
  // Apply the saved theme before the first paint, so a dark page never flashes white.
  try { var t = localStorage.getItem('cr-site-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/logo.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
