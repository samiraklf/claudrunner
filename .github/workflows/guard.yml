name: guard

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self test
        run: ./scripts/selftest.sh
      - name: Validate the dogfood config
        run: ./scripts/validate-config.sh
      - name: Private details
        env:
          PRIVATE_PATTERN: ${{ vars.PRIVATE_PATTERN }}
        run: ./scripts/check-leaks.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh templates/cron/*.sh
