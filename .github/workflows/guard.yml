name: guard

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self test
        run: ./scripts/selftest.sh
      - name: Validate the dogfood config
        run: ./plugins/claudrunner/runtime/validate-config.sh
      - name: Private details
        env:
          PRIVATE_PATTERN: ${{ vars.PRIVATE_PATTERN }}
        run: ./scripts/check-leaks.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: shellcheck releases disagree, and the local lint script checks for this version.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh plugins/claudrunner/runtime/*.sh plugins/claudrunner/runtime/lib/*.sh plugins/claudrunner/templates/cron/*.sh plugins/claudrunner/hooks/*.sh
