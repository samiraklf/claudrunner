name: demo page

# Publishes the status page with no data behind it, so it plays its built-in simulation.
# This is the public demo at https://samiraklf.github.io/claudrunner/ — no real tasks, ever.
on:
  push:
    branches: [main]
    paths: ["plugins/claudrunner/dashboard/**", ".github/workflows/demo-page.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          mkdir -p site
          cp plugins/claudrunner/dashboard/index.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
