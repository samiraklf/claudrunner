name: website

# Builds https://samiraklf.github.io/claudrunner/ — the home page, the guides and the docs
# from docs/, with GitHub's own Pages builder — and puts the status page demo at /demo/.
# The demo has no data behind it, so it plays its built-in simulation: no real tasks, ever.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "plugins/claudrunner/dashboard/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Add the status page demo
        run: |
          sudo mkdir -p _site/demo
          sudo cp plugins/claudrunner/dashboard/index.html _site/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
