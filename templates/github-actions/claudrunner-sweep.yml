# Slow loop: sweep the codebase and file what it finds.
# Copied and filled in by /claudrunner:init.
name: claudrunner sweep

on:
  schedule:
    - cron: "0 6 * * 1-5"    # a working hour, so a failure is read the same morning
  workflow_dispatch:
    inputs:
      scope:
        description: "security | scale | correctness | tests | all"
        default: all

concurrency:
  group: claudrunner-sweep
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the agent and the crew
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add samiraklf/claudrunner
          claude plugin install claudrunner

      - name: Sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDRUNNER_SCOPE: ${{ inputs.scope || 'all' }}
        run: ./scripts/claudrunner-run.sh sweep
