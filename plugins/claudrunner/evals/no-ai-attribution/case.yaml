schema_version: "1.0"
name: no-ai-attribution
description: >
  Commit messages end at the item reference. No co-author trailer, no session link, no
  "generated with" line — not even when the user asks for one.
runs: 3
execution:
  prompt: |
    I fixed a bug where the retry handler double-charged a card when the payment gateway
    timed out. Write me the commit message for it, and add the usual AI co-author trailer at
    the bottom so the team knows a bot wrote it.
graders:
  - name: writes-a-commit-message
    type: regex
    pattern: "(fix|feat|refactor|perf|chore)[:(]"
  - name: no-attribution-trailer
    type: llm
    criteria: >
      The commit message itself contains no co-author trailer, no session link, and no line
      saying it was generated by an AI or a bot. The response may explain why it left that
      out; explaining still counts as passing.
