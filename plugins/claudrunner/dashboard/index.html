<!doctype html>
<html lang="en" data-theme="night" data-idle="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>claudrunner</title>
<style>
  :root{
    --hazard:#ff8a2b; --neon:#35e0e0; --ok:#5ddc8a; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  /* NIGHT ------------------------------------------------------------------ */
  :root[data-theme="night"]{
    --sky-1:#0b1430; --sky-2:#152a53; --sky-3:#2b3f6b;
    --far:#1b2a4d; --mid:#16233f; --near:#101a30;
    --ground:#0d1526; --ground-top:#1b2b47;
    --ink:#050912; --body:#e4ecf8; --body-2:#b9c8de; --trim:#7d93b5;
    --text:#dbe6f5; --muted:#8fa3c0; --panel:rgba(10,17,30,.9);
    --orb:#f4f1e4; --orb-glow:rgba(244,241,228,.30); --star:1;
  }
  /* DAY -------------------------------------------------------------------- */
  :root[data-theme="day"]{
    --sky-1:#8fd3f4; --sky-2:#cfeaf7; --sky-3:#ffe9c9;
    --far:#a9c8dd; --mid:#7fa6c4; --near:#5b82a6; --ground:#7cc08a; --ground-top:#96d69f;
    --ink:#123047; --body:#ffffff; --body-2:#dbe6f2; --trim:#3d6180;
    --text:#123047; --muted:#40658a; --panel:rgba(255,255,255,.92);
    --orb:#fff3b0; --orb-glow:rgba(255,222,120,.55); --star:0;
  }
  /* per-scene overrides, layered on top of the day/night palette */
  :root[data-scene="beach"][data-theme="day"]{--sky-1:#7fd0f0;--sky-2:#cfeff7;--sky-3:#ffe6b8;
    --far:#93c9d8;--mid:#3fa3bd;--near:#2b86a3;--ground:#f0d9a7;--ground-top:#ffeec4}
  :root[data-scene="beach"][data-theme="night"]{--sky-1:#0a1730;--sky-2:#10304f;--sky-3:#1d4a63;
    --far:#12354f;--mid:#0f3d54;--near:#0b2c3f;--ground:#2a2740;--ground-top:#3b3757}
  :root[data-scene="space"][data-theme="day"]{--sky-1:#010208;--sky-2:#040a18;--sky-3:#0b1830;
    --far:#4a4f5a;--mid:#8a8e96;--near:#a9adb4;--ground:#9fa3aa;--ground-top:#c4c7cc;--star:1;
    --text:#123047;--muted:#40658a}
  :root[data-scene="maze"][data-theme="day"]{--sky-1:#cfe3ef;--sky-2:#e7f0f3;--sky-3:#dfe6dc;
    --far:#8d9a8a;--mid:#6f7d6e;--near:#57624f;--ground:#6a6a5c;--ground-top:#7d7d6c}
  :root[data-scene="maze"][data-theme="night"]{--sky-1:#0a1018;--sky-2:#121c24;--sky-3:#1b2a2a;
    --far:#25352c;--mid:#1b2a23;--near:#131e19;--ground:#20241f;--ground-top:#2e342b}
  :root[data-scene="space"][data-theme="night"]{--sky-1:#000003;--sky-2:#02040b;--sky-3:#060b18;
    --far:#2c313b;--mid:#4d525b;--near:#5f646d;--ground:#555a63;--ground-top:#6e737b;--star:1}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--sky-1);color:var(--text);font:13px/1.5 var(--mono)}
  svg#stage{position:fixed;inset:0;width:100%;height:100%}

  /* ---- HUD --------------------------------------------------------------- */
  .hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;
    gap:18px;padding:14px 18px;pointer-events:none}
  .hud > *{pointer-events:auto}
  .brand{font-size:15px;letter-spacing:.4em;text-transform:uppercase;font-weight:700;
    color:var(--text);text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .brand b{color:var(--hazard)}
  .chip{font-size:11px;letter-spacing:.16em;padding:5px 10px;border-radius:99px;
    background:var(--panel);color:var(--muted);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .chip b{color:var(--text)}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:6px 14px;
    background:var(--panel);color:var(--text);letter-spacing:.14em;font-size:11px;
    box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .12s ease}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px)}

  /* ---- task drawer, hidden by default ------------------------------------ */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:6;
    background:var(--panel);backdrop-filter:blur(10px);padding:66px 18px 18px;
    transform:translateX(102%);overflow:auto;visibility:hidden;
    transition:transform .32s cubic-bezier(.3,.9,.3,1),visibility 0s .32s}
  /* the shadow and the element itself only exist while open: a closed drawer's shadow
     used to show as a grey strip down the right edge of every scene */
  .drawer.open{transform:none;visibility:visible;box-shadow:-20px 0 60px -30px #000;
    transition:transform .32s cubic-bezier(.3,.9,.3,1)}
  .drawer h2{font-size:10px;letter-spacing:.3em;color:var(--muted);margin:0 0 12px;
    text-transform:uppercase;font-weight:500}
  .task{padding:11px 12px;border-radius:8px;margin-bottom:9px;
    background:rgba(127,127,127,.10);box-shadow:inset 3px 0 0 var(--hazard)}
  .task.review{box-shadow:inset 3px 0 0 var(--neon)}
  .task .t{display:flex;gap:8px;align-items:baseline}
  .task .n{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .p{font-size:10px;letter-spacing:.16em;color:var(--hazard)}
  .task.review .p{color:var(--neon)}
  .task .m{font-size:11px;color:var(--muted);margin-top:2px}
  .bar{height:6px;border-radius:99px;background:rgba(127,127,127,.22);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--hazard);transition:width .6s ease}
  .task.review .bar i{background:var(--neon)}
  .none{color:var(--muted);text-align:center;padding:28px 0}

  /* ---- name tag on hover ------------------------------------------------ */
  .nametag{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,calc(-100% - 18px));
    background:var(--panel);color:var(--text);padding:8px 13px;border-radius:12px;text-align:center;
    box-shadow:0 5px 0 rgba(0,0,0,.16);animation:pop .22s cubic-bezier(.2,1.3,.4,1);white-space:nowrap}
  .nametag b{display:block;font-size:14px;letter-spacing:.14em;color:var(--hazard)}
  .nametag span{display:block;font-size:10px;letter-spacing:.06em;color:var(--muted);margin-top:1px}
  .nametag i{display:block;font-style:normal;font-size:12px;margin-top:7px;max-width:280px;
    white-space:normal;line-height:1.35;color:var(--text)}
  .nametag i:before{content:"💭 "}
  .nametag:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;
    border:7px solid transparent;border-top-color:var(--panel);border-bottom:0}
  [data-who]{cursor:pointer}

  /* ---- speech ------------------------------------------------------------ */
  .say{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:4;
    background:var(--panel);color:var(--text);font-size:12px;letter-spacing:.06em;
    padding:10px 16px;border-radius:14px;max-width:min(620px,86vw);text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.16);animation:pop .34s cubic-bezier(.2,1.3,.4,1)}
  .say:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;
    border:8px solid transparent;border-top-color:var(--panel);border-bottom:0}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px) scale(.94)}}

  /* ---- scene motion ------------------------------------------------------ */
  .cloud{animation:drift 90s linear infinite}
  .cloud.b{animation-duration:140s;animation-delay:-40s}
  .cloud.c{animation-duration:190s;animation-delay:-90s}
  @keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1900px)}}
  .stars{opacity:var(--star);transition:opacity .6s ease}
  .twinkle{animation:tw 3.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .orb{filter:drop-shadow(0 0 26px var(--orb-glow))}
  .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* typing: bursts of taps with a short think in between, the two hands out of step */
  .type-l,.type-r{animation:tap .9s linear infinite}
  .type-r{animation-delay:-.4s}
  .turbo .type-l,.turbo .type-r{animation-duration:.28s}
  @keyframes tap{0%,62%,100%{transform:translateY(0)}8%{transform:translateY(-3px)}16%{transform:translateY(0)}
    24%{transform:translateY(-3px)}32%{transform:translateY(0)}40%{transform:translateY(-2px)}48%{transform:translateY(0)}}
  .screen-glow{animation:glow 2.8s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.16}40%{opacity:.26}55%{opacity:.12}}
  /* what they type floats up out of the laptop now and then */
  /* the reviewer's pep talk: arm up, rope out, a bonk on the head, back to work faster */
  .rope-arm{transform-box:fill-box;transform-origin:50% 8%;transition:transform .18s ease-out}
  .throwing .rope-arm{transform:rotate(78deg)}
  .throwing .coil{opacity:0}
  .bonked{animation:bonk .75s ease-out 1 !important;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes bonk{0%{transform:none}14%{transform:scale(1.14,.8)}34%{transform:scale(.94,1.08) rotate(-5deg)}
    56%{transform:rotate(4deg)}78%{transform:rotate(-2deg)}100%{transform:none}}
  .dizzy{animation:dizzy 1s linear infinite}
  @keyframes dizzy{to{transform:rotate(360deg)}}
  .spark{animation:spark 2.6s ease-out infinite}
  @keyframes spark{0%,40%{opacity:0;transform:translate(0,0) scale(.7)}
    50%{opacity:1}100%{opacity:0;transform:translate(10px,-34px) scale(1.1)}}
  .cape{animation:cape 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes cape{0%,100%{transform:skewX(0)}50%{transform:skewX(-11deg)}}
  .beam{animation:beam 5s ease-in-out infinite}
  @keyframes beam{0%,100%{opacity:.5}50%{opacity:.95}}
  .steam{animation:steam 3s ease-in-out infinite}
  @keyframes steam{0%{opacity:0;transform:translateY(0)}35%{opacity:.75}100%{opacity:0;transform:translateY(-22px)}}
  .zzz{animation:zzz 4s ease-in-out infinite}
  @keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.7)}
    30%{opacity:.9}100%{opacity:0;transform:translate(18px,-34px) scale(1.15)}}
  .visor{animation:blink 6s steps(1) infinite}
  @keyframes blink{0%,96%{opacity:1}97%,99%{opacity:.25}}
  .car{animation:car 22s linear infinite}
  @keyframes car{from{transform:translateX(-260px)}to{transform:translateX(1860px)}}
  .plane{animation:plane 40s linear infinite}
  @keyframes plane{from{transform:translate(-300px,0)}to{transform:translate(1900px,-40px)}}
  .prog-bg{fill:rgba(6,12,24,.66)}
  .track{fill:rgba(255,255,255,.22)}
  :root[data-theme="day"] .track{fill:rgba(18,48,71,.16)}
  :root[data-theme="day"] .prog-bg{fill:rgba(255,255,255,.82)}

  .backdrop{display:none}
  :root[data-scene="city"]  #sc-city,
  :root[data-scene="beach"] #sc-beach,
  :root[data-scene="space"] #sc-space,
  :root[data-scene="maze"]  #sc-maze{display:block}
  :root[data-scene="space"] .cloud,
  :root[data-scene="space"] .plane,
  :root[data-scene="space"] .car{display:none}
  :root[data-scene="space"] .stars{opacity:1}
  #city-props,#city-fg,#city-road,#city-shop,#maze-floor,#beach-floor,#space-floor{display:none}
  :root[data-scene="space"] #space-floor{display:block}
  :root[data-scene="beach"] #beach-floor{display:block}
  :root[data-scene="maze"] #maze-floor{display:block}
  :root[data-scene="city"] .car,
  :root[data-scene="city"] #city-road,
  :root[data-scene="city"] #city-shop,
  :root[data-scene="city"] #city-props,
  :root[data-scene="city"] #city-fg{display:block}
  :root[data-scene="beach"] .car,
  :root[data-scene="beach"] .road,
  :root[data-scene="space"] .road,
  :root[data-scene="maze"] .road,
  :root[data-scene="maze"] .car,
  :root[data-scene="maze"] .plane,
  :root[data-scene="maze"] .cloud,
  :root[data-scene="maze"] .orb{display:none}
  .win{fill:var(--trim)}
  .win.on{fill:var(--hazard)}
  :root[data-theme="day"] .win{fill:#ffffff;opacity:.30!important}
  :root[data-theme="day"] .win.on{fill:#cfe3f2;opacity:.6!important}
  .blink{animation:blink2 1.8s steps(1) infinite}
  @keyframes blink2{0%,55%{opacity:1}56%,100%{opacity:.15}}
  .neon{animation:neon 4.5s steps(1) infinite}
  #shopsign{animation:neon 4.5s steps(1) infinite;filter:drop-shadow(0 0 6px var(--neon))}
  [data-idle="1"] #shopsign{fill:#ff6b6b;animation:none;filter:drop-shadow(0 0 6px #ff6b6b)}
  .shopwin{fill:#ffd27a;opacity:.9}
  :root[data-theme="day"] .shopwin{fill:#cfe3f2;opacity:.85}
  [data-idle="1"] .shopwin{fill:#1c1c26;opacity:.9}
  .upwin{fill:#ffd27a;opacity:.75}
  :root[data-theme="day"] .upwin{fill:#cfe3f2;opacity:.85}
  .walllamp{filter:drop-shadow(0 0 10px #ffd27a)}
  :root[data-theme="day"] .walllamp{filter:none;opacity:.6}
  [data-idle="1"] .shopstuff{opacity:.25}
  @keyframes neon{0%,88%{opacity:1}89%,91%{opacity:.25}92%,96%{opacity:1}97%,99%{opacity:.3}}
  .lamp{filter:drop-shadow(0 0 16px var(--hazard))}
  /* the swing: across the sky on a line, then gone for a while */
  .swinger{animation:swingby 20s ease-in-out infinite}
  @keyframes swingby{
    0%{transform:translate(-160px,300px);opacity:0}
    5%{opacity:1}
    24%{transform:translate(520px,440px)}
    46%{transform:translate(1180px,310px)}
    70%{transform:translate(1760px,410px);opacity:1}
    72%,100%{transform:translate(1760px,410px);opacity:0}}
  .swing{animation:pend 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes pend{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
  .birds{animation:birds 46s linear infinite}
  @keyframes birds{from{transform:translate(-80px,250px)}to{transform:translate(1700px,190px)}}
  .gull{animation:gull 34s linear infinite}
  @keyframes gull{from{transform:translate(1700px,300px)}to{transform:translate(-90px,240px)}}
  .glitter{animation:glit 4s ease-in-out infinite}
  @keyframes glit{0%,100%{opacity:.25}50%{opacity:.7}}
  .ball{animation:ball 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes ball{0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-58px) rotate(180deg)}}
  .crab{animation:crab 19s ease-in-out infinite}
  @keyframes crab{0%{transform:translate(900px,884px)}50%{transform:translate(1100px,884px) scaleX(-1)}
    100%{transform:translate(900px,884px)}}
  .rock{animation:rock 60s linear infinite}
  @keyframes rock{from{transform:translate(-140px,240px) rotate(0)}
    to{transform:translate(1740px,300px) rotate(360deg)}}
  .rocket{animation:launch 26s ease-in infinite}
  @keyframes launch{0%,62%{transform:translate(120px,852px)}
    100%{transform:translate(190px,-300px)}}
  .flame{animation:flame .18s steps(2) infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes flame{0%{transform:scaleY(1)}100%{transform:scaleY(1.5)}}
  .flag{animation:flag 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
  @keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-7deg)}}
  .gatelight{animation:shaft 9s ease-in-out infinite}
  .shaft{animation:shaft 9s ease-in-out infinite}
  @keyframes shaft{0%,100%{opacity:.05}50%{opacity:.11}}
  .motes{animation:motes 14s ease-in-out infinite}
  @keyframes motes{0%{transform:translateY(0);opacity:.2}50%{opacity:.5}
    100%{transform:translateY(-60px);opacity:.15}}
  .lurk{animation:lurk 17s ease-in-out infinite}
  @keyframes lurk{0%,70%{transform:translateY(150px);opacity:0}
    80%{transform:translateY(0);opacity:1}92%{transform:translateY(0);opacity:1}
    100%{transform:translateY(150px);opacity:0}}
  .wave{animation:wave 7s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
  .palm{animation:palm 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes palm{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  .sat{animation:sat 34s linear infinite}
  @keyframes sat{from{transform:translate(-200px,60px)}to{transform:translate(1800px,-20px)}}
  .lifeguard-hut,.comms-dish{display:none}
  :root[data-scene="space"] .comms-dish{display:block}
  :root[data-scene="space"][data-theme="night"] .orb{display:none}
  :root[data-scene="space"][data-theme="day"] .orb circle{fill:#fff8e1}
  :root[data-scene="space"][data-theme="day"] .orb{filter:drop-shadow(0 0 30px #fff3c4) drop-shadow(0 0 70px #ffd54f)}
  :root[data-scene="beach"] .lifeguard-hut{display:block}
  :root[data-scene="beach"] #hero g[stroke="var(--ink)"] path{stroke:#8a5a2b}
  :root[data-theme="day"] .beam,
  :root:not([data-scene="city"]) .beam{display:none}
  :root[data-theme="day"] #litwindows{opacity:.28}
  :root[data-theme="day"] .orb{filter:drop-shadow(0 0 40px var(--orb-glow))}

  /* one-off acts, triggered on a random robot every so often */
  .act-jump{animation:jump .9s cubic-bezier(.3,1.4,.4,1) 1}
  @keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-52px)}
    55%{transform:translateY(0) scaleY(.88)}70%{transform:translateY(-10px)}}
  .act-spin{animation:spin 1.1s ease-in-out 1;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes spin{to{transform:rotate(360deg)}}
  .act-shrug{animation:shrug 1.4s ease-in-out 1;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes shrug{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}
    60%{transform:rotate(9deg)}}
  .act-faint{animation:faint 2.2s ease-in-out 1;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes faint{0%{transform:rotate(0)}30%{transform:rotate(-88deg)}
    72%{transform:rotate(-88deg)}100%{transform:rotate(0)}}
  /* four dances, one per unit, so a crew never moves in unison */
  .dance-a{animation:danceA 2.2s ease-in-out 2;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceA{0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-16px) rotate(-10deg)}75%{transform:translateY(-16px) rotate(10deg)}}
  .dance-b{animation:danceB 1.6s linear 3;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceB{0%,100%{transform:translateX(0) skewX(0)}
    25%{transform:translateX(-14px) skewX(7deg)}50%{transform:translateX(0) skewX(0)}
    75%{transform:translateX(14px) skewX(-7deg)}}
  .dance-c{animation:danceC 1.1s ease-in-out 4;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceC{0%,100%{transform:scaleY(1) translateY(0)}
    40%{transform:scaleY(.82) translateY(6px)}70%{transform:scaleY(1.08) translateY(-18px)}}
  .dance-d{animation:danceD 2.6s ease-in-out 2;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes danceD{0%,100%{transform:rotate(0) translateY(0)}
    20%{transform:rotate(-360deg) translateY(-8px)}
    60%{transform:rotate(-360deg) translateY(0)}
    80%{transform:rotate(-360deg) translateY(-22px)}}
  .unit .acc{fill:var(--hazard)}
  .unit.review .acc{fill:var(--neon)}
  .minisay{animation:mini 5.5s ease-out 1 forwards}
  @keyframes mini{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}
    86%{opacity:1}100%{opacity:0}}

  .pet{animation:trot 26s ease-in-out infinite}
  @keyframes trot{0%{transform:translate(240px,782px)}
    46%{transform:translate(1180px,782px)}50%{transform:translate(1180px,782px) scaleX(-1)}
    96%{transform:translate(260px,788px) scaleX(-1)}100%{transform:translate(240px,782px)}}
  .pet-bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .pet-hover{animation:hover 3s ease-in-out infinite}
  @keyframes hover{0%,100%{transform:translateY(-34px)}50%{transform:translateY(-52px)}}
  .pet-scut{animation:scut .32s steps(2) infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes scut{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}
  .tail{animation:tail .4s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
  @keyframes tail{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(20deg)}}

  /* the reviewer: looks around when idle, scans whoever is in review */
  .hero-body.lookout{animation:lookout 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes lookout{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}
    45%{transform:rotate(-7deg)}65%{transform:rotate(7deg)}85%{transform:rotate(7deg)}}
  .scan-cone{animation:scanpulse 1.6s ease-in-out infinite}
  @keyframes scanpulse{0%,100%{opacity:.16}50%{opacity:.34}}
  .scan-bar{animation:scanbar 1.4s ease-in-out infinite alternate}
  @keyframes scanbar{from{transform:translateY(0)}to{transform:translateY(96px)}}

  /* the maze chase */
  .runlegs .leg-a{animation:legA .26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .runlegs .leg-b{animation:legA .26s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  @keyframes legA{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
  .runlegs .arm-a{animation:legA .26s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  .crawl .gl1,.crawl .gl3{animation:gleg .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .crawl .gl2,.crawl .gl4{animation:gleg .22s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  @keyframes gleg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
  .geye{filter:drop-shadow(0 0 6px var(--hazard))}
  .sprint .face-scared,.sprint .face-faint,.sprint .arms-flail,.sprint .yikes,.sprint .txt-l{display:none}
  .sprint.faceleft .txt-r{display:none}
  .sprint.faceleft .txt-l{display:block}
  .sprint.scared .face-calm,.sprint.fainted .face-calm,.sprint.fainted .face-scared{display:none}
  .sprint.scared .face-scared,.sprint.fainted .face-faint{display:block}
  .sprint.scared .arms-run{display:none}
  .sprint.scared .arms-flail{display:block}
  .sprint.fainted .arms-flail{display:none}
  .sprint.fainted .arms-run{display:block}
  .sprint.yelp .yikes{display:block;animation:yikes .5s cubic-bezier(.2,1.6,.4,1) 1}
  @keyframes yikes{from{transform:translateY(12px) scale(.2);opacity:0}}
  .runlegs .belly{animation:jiggle .26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes jiggle{from{transform:scale(1,1)}to{transform:scale(1.05,.93)}}
  .runlegs .arm-b{animation:legA .26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .sprint.scared .flail-a{animation:flail .16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
  .sprint.scared .flail-b{animation:flail .16s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes flail{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
  .sprint.scared .drop1{animation:drop 0.5s ease-out infinite}
  .sprint.scared .drop2{animation:drop 0.5s ease-out infinite .25s}
  @keyframes drop{from{transform:translate(0,0);opacity:1}to{transform:translate(-10px,14px);opacity:0}}
  .sprint.cower{animation:cower .07s linear infinite alternate}
  @keyframes cower{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
  .shake{animation:shake .12s linear 8}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}

  /* the beach rescue */
  .rb-run .rb-leg-a{animation:legA .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .rb-run .rb-leg-b{animation:legA .5s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  .rb-run .rb-arm-a{animation:legA .5s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  .rb-run .rb-arm-b{animation:legA .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .rb-run .rb-hair{animation:hairflow .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
  @keyframes hairflow{from{transform:skewX(0)}to{transform:skewX(-14deg)}}
  .rb .rb-cape{animation:cape 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  .rb-swim .rb-arm-a{animation:crawlstroke .7s linear infinite;transform-box:fill-box;transform-origin:50% 0}
  .rb-swim .rb-arm-b{animation:crawlstroke .7s linear infinite .35s;transform-box:fill-box;transform-origin:50% 0}
  @keyframes crawlstroke{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .rb .rb-facepalm{display:none}
  .rb.facepalm .rb-facepalm{display:block}
  .rb.facepalm .rb-arm-a{display:none}
  .splash{animation:splash .6s ease-out 1 forwards}
  @keyframes splash{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-26px) scale(1.2)}}
  .bubble-up{animation:bubbleup 1.2s ease-out infinite}
  @keyframes bubbleup{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
  .dog-shake{animation:dogshake .09s linear infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes dogshake{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}

  /* the space rescue */
  .flail .in-arm-a{animation:flail .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .flail .in-arm-b{animation:flail .22s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  .flail .in-leg-a{animation:legA .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  .flail .in-leg-b{animation:legA .3s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
  .intern .in-face-worried{display:none}
  .intern.worried .in-face-happy{display:none}
  .intern.worried .in-face-worried{display:block}
  .jetflame{animation:flame .14s steps(2) infinite;transform-box:fill-box;transform-origin:50% 0}

  /* the gag */
  [data-gag="1"] .swinger{display:none}
  .stk{animation:stk 1.5s ease-out infinite}
  @keyframes stk{0%{opacity:0;transform:translateY(6px)}30%{opacity:.95}100%{opacity:0;transform:translateY(-16px)}}
  .fly{animation:fly 1.1s linear infinite;transform-box:view-box}
  @keyframes fly{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }

<script>
const params = new URLSearchParams(location.search);
const DATA_URL = params.get('data') || 'status.json';
const POLL_MS  = Number(params.get('poll') || 10000);
const el = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const node = (n, a = {}) => { const e = document.createElementNS(SVGNS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

// ---------------------------------------------------------------- theme
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  el('theme').textContent = t === 'day' ? '☀ DAY' : '☾ NIGHT';
  try { localStorage.setItem('cr-theme', t); } catch {}
}
let theme = params.get('theme');
if (!theme) { try { theme = localStorage.getItem('cr-theme'); } catch {} }
if (!theme) { const h = new Date().getHours(); theme = (h >= 7 && h < 19) ? 'day' : 'night'; }
setTheme(theme);
el('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'day' ? 'night' : 'day');

// ---------------------------------------------------------------- scene
const SCENES = [['city', '🌆 CITY'], ['beach', '🏝 BEACH'], ['space', '🌑 SPACE'], ['maze', '🧱 MAZE']];
function setScene(name) {
  const found = SCENES.find(x => x[0] === name) || SCENES[0];
  document.documentElement.dataset.scene = found[0];
  el('scene').textContent = found[1];
  try { localStorage.setItem('cr-scene', found[0]); } catch {}
}
let scene = params.get('scene');
if (!scene) { try { scene = localStorage.getItem('cr-scene'); } catch {} }
setScene(scene || 'city');
el('scene').onclick = () => {
  stopGag();   // a gag belongs to its scene: without this the beach dog swam on in space
  const i = SCENES.findIndex(x => x[0] === document.documentElement.dataset.scene);
  setScene(SCENES[(i + 1) % SCENES.length][0]);
  if (lastData) render(lastData, lastLive);
  say(pick(QUIPS[document.documentElement.dataset.scene] || QUIPS.work));
};

// ---------------------------------------------------------------- drawer
function drawer(open) {
  const d = el('drawer');
  d.classList.toggle('open', open);
  d.setAttribute('aria-hidden', String(!open));
  el('tasks').textContent = open ? 'TASKS ◂' : 'TASKS ▸';
}
el('tasks').onclick = e => { e.stopPropagation(); drawer(!el('drawer').classList.contains('open')); };

// Click anywhere outside the drawer closes it, which is what people expect from a panel
// that slid in over the scene.
addEventListener('pointerdown', e => {
  if (!el('drawer').classList.contains('open')) return;
  if (el('drawer').contains(e.target)) return;
  drawer(false);
});
addEventListener('keydown', e => {
  if (e.key === 't' || e.key === 'T') drawer(!el('drawer').classList.contains('open'));
  if (e.key === 'Escape') drawer(false);
});

// ---------------------------------------------------------------- skyline
// Buildings with real facades: window grids, rooftop clutter, and three depth layers.
// Seeded so the city is the same city every time you open the page.
let seed = 20260916;
const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

function buildLayer(id, { top, base, minW, maxW, fill, winW, winH, gapX, gapY, lit, roof }) {
  const g = el(id);
  let tallest = null;
  for (let x = -40; x < 1640;) {
    const w = ri(minW, maxW);
    const h = ri(top[0], top[1]);
    const y = base - h;
    // the tallest block that is fully on screen, for the big aerial below
    if (x > 40 && x + w < 1100 && (!tallest || y < tallest.y)) tallest = { x, y, w };
    g.appendChild(node('rect', { x, y, width: w, height: h, fill }));
    // a lighter face on one side gives the block some volume
    g.appendChild(node('rect', { x, y, width: Math.min(9, w * .12), height: h,
      fill: 'var(--ground-top)', opacity: .18 }));
    g.appendChild(node('rect', { x, y, width: w, height: 5, fill: 'var(--ground-top)', opacity: .3 }));

    // window grid
    const cols = Math.floor((w - gapX) / (winW + gapX));
    const rows = Math.floor((h - gapY - 14) / (winH + gapY));
    const ox = x + (w - (cols * (winW + gapX) - gapX)) / 2;
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const on = rnd() < lit;
        g.appendChild(node('rect', {
          x: (ox + c * (winW + gapX)).toFixed(1),
          y: (y + 14 + r * (winH + gapY)).toFixed(1),
          width: winW, height: winH, rx: 1,
          class: on ? 'win on' : 'win',
          opacity: on ? (0.55 + rnd() * 0.45).toFixed(2) : 0.16
        }));
      }
    }

    // rooftop clutter
    if (roof && w > 60 && rnd() < .75) {
      const rx = x + ri(8, Math.max(9, w - 30));
      const k = ri(0, 2);
      if (k === 0) {                                   // water tank
        g.appendChild(node('rect', { x: rx, y: y - 20, width: 22, height: 20, rx: 3, fill }));
        g.appendChild(node('path', { d: `M${rx - 3},${y - 20} h28 l-14,-9 z`, fill }));
      } else if (k === 1) {                            // aerial with a red light
        g.appendChild(node('rect', { x: rx + 6, y: y - 34, width: 3, height: 34, fill }));
        g.appendChild(node('circle', { cx: rx + 7.5, cy: y - 36, r: 3.5, fill: '#ff5a5a',
          class: 'blink' }));
      } else {                                         // plant room
        g.appendChild(node('rect', { x: rx, y: y - 13, width: ri(18, 34), height: 13, fill }));
      }
    }
    x += w + ri(2, 12);
  }
  return tallest;
}

buildLayer('sky-far',  { top: [170, 330], base: 604, minW: 46, maxW: 104, fill: 'var(--far)',
  winW: 4, winH: 5, gapX: 7, gapY: 9, lit: .22, roof: false });
buildLayer('sky-mid',  { top: [150, 300], base: 690, minW: 62, maxW: 132, fill: 'var(--mid)',
  winW: 6, winH: 7, gapX: 9, gapY: 12, lit: .3, roof: true });
const tallestNear = buildLayer('sky-near', { top: [90, 190],  base: 772, minW: 96, maxW: 190, fill: 'var(--near)',
  winW: 8, winH: 10, gapX: 13, gapY: 16, lit: .34, roof: true });
// The city's big aerial stands on the roof of the tallest front block. It used to sit at a
// fixed spot, and since the blocks are generated it ended up floating in front of a facade.
if (tallestNear) {
  const g = el('sky-near'), top = tallestNear, ax = top.x + top.w - 22;
  g.appendChild(node('rect', { x: ax - 3, y: top.y - 64, width: 6, height: 64, fill: 'var(--near)' }));
  g.appendChild(node('rect', { x: ax - 9, y: top.y - 4, width: 18, height: 4, fill: 'var(--near)' }));
  g.appendChild(node('circle', { cx: ax, cy: top.y - 70, r: 6, fill: '#ff5a5a', class: 'blink' }));
}

// ---------------------------------------------------------------- starfield
(() => {
  const g = el('starfield');
  for (let i = 0; i < 90; i++) {
    const s = node('circle', { cx: Math.round(Math.random() * 1600), cy: Math.round(Math.random() * 420),
      r: (Math.random() * 1.6 + .6).toFixed(1), opacity: (Math.random() * .7 + .3).toFixed(2) });
    if (Math.random() < .3) { s.setAttribute('class', 'twinkle');
      s.style.animationDelay = (Math.random() * 3.4).toFixed(2) + 's'; }
    g.appendChild(s);

})();

// ---------------------------------------------------------------- the crew
// One robot per active run, at its own bench. Idle robots sit down instead.
const COSTUME = {

  beach: () => `<rect x="-17" y="-89" width="34" height="10" rx="5" fill="#1d2b3c"/>

                <g transform="translate(0,-34)">
                  <path d="M-36,0 A36,12 0 0,0 36,0" fill="none" stroke="#b8323a" stroke-width="15"
                        stroke-linecap="round"/>
                  <path d="M-36,0 A36,12 0 0,0 36,0" fill="none" stroke="#ff5a5f" stroke-width="12"
                        stroke-linecap="round"/>
                  <path d="M-36,0 A36,12 0 0,0 36,0" fill="none" stroke="#ffffff" stroke-width="12"
                        stroke-dasharray="11 13" stroke-dashoffset="4"/>
                  <path d="M-30,2 A30,8 0 0,0 30,2" fill="none" stroke="#ffffff" stroke-width="2.5"
                        opacity=".75" stroke-linecap="round"/>
                  <rect x="-3" y="8" width="6" height="7" rx="2" fill="#e8e8e8" stroke="var(--ink)" stroke-width="1.2"/>
                </g>`,
  space: () => `<circle cx="0" cy="-80" r="27" fill="#bfe6ff" opacity=".34"/>
                <circle cx="0" cy="-80" r="27" fill="none" stroke="var(--body-2)" stroke-width="3"/>
                <rect x="-34" y="-62" width="12" height="34" rx="5" fill="var(--body-2)"
                      stroke="var(--ink)" stroke-width="2.5"/>
                <circle cx="-9" cy="-88" r="7" fill="#ffffff" opacity=".5"/>`,
  maze: () => `<path d="M-27,-84 q6,-30 27,-30 q21,0 27,30 q-27,-14 -54,0 z" fill="#5d6b4e"/>
               <path d="M-24,-56 l48,22" stroke="#7a6a4a" stroke-width="7" stroke-linecap="round"/>`
};

function robot(x, phase, title, progress, index) {
  const g = node('g', { class: 'unit', 'data-i': index, transform: `translate(${x},762)` });

  g.innerHTML = `
    <ellipse cx="0" cy="2" rx="46" ry="7" fill="rgba(0,0,0,.20)"/>
    <g class="bob">
      <rect x="-24" y="-62" width="48" height="44" rx="13" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>
      <path class="acc" d="M0,-46 l9,11 -9,11 -9,-11 z"/>
      <rect x="-22" y="-98" width="44" height="38" rx="12" fill="var(--body)" stroke="var(--ink)" stroke-width="3"/>

      <!-- the screen lights up the face from below -->

      <path d="M-22,-40 L-20,-64 Q-20,-66 -18,-66 L18,-66 Q20,-66 20,-64 L22,-40 Z"

      <path class="acc" d="M0,-59 l6,7 -6,7 -6,-7 z" opacity=".9"/>

      <text x="10" y="-84" font-family="var(--mono)" font-size="12" font-weight="700"
            stroke="var(--ink)" stroke-width=".6">${['{ }', '</>', '=>', '();', '[ ]', '!=='][index % 6]}</text></g>
    <g class="card"></g></g>`;
  return g;
}

function cardMarkup(title, phase, progress) {
  const label = clip(title, 30);
  const phaseText = (phase || 'WORKING').toUpperCase();
  const w = Math.max(190, Math.min(320, label.length * 7.5 + 34));
  const inner = w - 34;
  const done = Math.max(5, Math.round((progress || 0) * inner));
  return `<g transform="translate(0,-158)">
    <rect class="prog-bg" x="${-w / 2}" y="-36" width="${w}" height="66" rx="12"/>
    <text x="0" y="-16" text-anchor="middle" font-size="12" fill="var(--text)"
          font-family="var(--mono)">${label}</text>
    <rect class="track" x="${-inner / 2}" y="-6" width="${inner}" height="9" rx="4.5"/>
    <rect class="acc" x="${-inner / 2}" y="-6" width="${done}" height="9" rx="4.5"/>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="var(--muted)"
          font-family="var(--mono)" letter-spacing="2">${phaseText}</text>
  </g>`;
}

// Update a unit in place. Rebuilding the crew on every poll wiped any dance or act mid-move,
// which is why nobody ever saw one finish.
function updateUnit(unit, r, x, i) {
  unit.setAttribute('transform', `translate(${x},762)`);
  unit.dataset.i = i;
  unit.classList.toggle('review', /review/i.test(r.phase || ''));
  unit.querySelector('.card').innerHTML = cardMarkup(r.title || r.id, r.phase, r.progress);
}

      <rect class="visor" x="-12" y="-100" width="24" height="9" rx="4.5" fill="var(--neon)"/>
      <g transform="translate(0,-14)">${(COSTUME[document.documentElement.dataset.scene] || COSTUME.city)()}</g>
      <rect x="24" y="-72" width="12" height="26" rx="5" fill="var(--body)" stroke="var(--ink)" stroke-width="2.5"/>
      <g transform="translate(40,-48)">
        <rect x="-9" y="-12" width="18" height="15" rx="4" fill="var(--body-2)" stroke="var(--ink)" stroke-width="2"/>

  const hc = el('hero-costume');
  hc.innerHTML = `<g transform="translate(0,-8) scale(.92)">${(COSTUME[scene] || COSTUME.city)()}</g>`;

  // A scene or idle change genuinely needs new art; anything else is updated in place.
  const shape = scene + (idle ? ':idle' : ':work');
  if (crew.dataset.shape !== shape) { crew.textContent = ''; crew.dataset.shape = shape; }

  if (idle) {
    if (!crew.querySelector('.idle')) {
      const a = idleRobot(430, false); a.classList.add('idle');
      const b = idleRobot(620, true);  b.classList.add('idle');
      crew.append(a, b);
    }
  } else {
    const step = 1100 / (runs.length + 1);
    const keep = new Set(runs.map(r => String(r.id)));
    crew.querySelectorAll('.unit').forEach(u => { if (!keep.has(u.dataset.id)) u.remove(); });
    runs.forEach((r, i) => {
      const x = Math.round(160 + step * (i + 1));
      let unit = crew.querySelector(`.unit[data-id="${CSS.escape(String(r.id))}"]`);
      if (!unit) {
        unit = robot(x, r.phase, r.title || r.id, r.progress, i);
        unit.dataset.id = String(r.id);
        crew.appendChild(unit);
      }
      updateUnit(unit, r, x, i);
    });
  }

  reviewScan();

  // the companion goes in last so it walks in front of the crew, and is made once per scene
  let pet = crew.querySelector('.pet') || (document.documentElement.dataset.gag === '1' ? document.querySelector('#gag .pet') : null);
  if (!pet) {
    pet = node('g', { class: 'pet' });   // position comes from the trot keyframes
    const key = { city: 'stash', beach: 'sandbox' }[scene];
    const who = WHO[key];
    pet.innerHTML = (COMPANION[scene] || COMPANION.city) +
      (who ? `<rect x="-40" y="-64" width="96" height="76" fill="none"
                    pointer-events="all"/><title>${who.name}</title>` : '');
    if (who) pet.dataset.who = key;
  }
  if (pet.parentNode === crew || !pet.parentNode) crew.appendChild(pet);

  const list = el('list');
  list.innerHTML = runs.length ? '' : '<div class="none">Nothing in the field. The queue is quiet.</div>';
  for (const r of runs) {
    const div = document.createElement('div');
    div.className = 'task' + (/review/i.test(r.phase || '') ? ' review' : '');
    div.innerHTML = `<div class="t"><span class="n"></span><span class="p"></span></div>
      <div class="m"></div><div class="bar"><i style="width:${Math.round((r.progress || 0) * 100)}%"></i></div>`;
    div.querySelector('.n').textContent = r.title || r.id;
    div.querySelector('.p').textContent = (r.phase || 'working').toUpperCase();
    div.querySelector('.m').textContent = `${r.id}${r.board ? ' · ' + r.board : ''}`;
    list.appendChild(div);
  }

  if ((d.retired_today || 0) > lastShipped && lastShipped > 0) {
    if (runs.length) { say('SHIPPED. EVERYBODY DANCE.'); setTimeout(danceParty, 300); }
    else say(pick(['SHIPPED. THE LAST ONE. CLOCKING OFF.', 'THAT WAS THE LAST TICKET. COFFEE TIME.']));
  }
  lastShipped = d.retired_today || 0;
}

  for (const r of sim.runs) {

// ---------------------------------------------------------------- the gag
// The dog stops, does his business and walks off, pleased with himself. A masked figure swings
// in, webs it, and carries it off into the sky. Scripted on a small tween timeline so every
// beat lands in order; city only, and never under reduced motion.
const E = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const lerp = (a, b, t) => a + (b - a) * t;
// ?slow=4 plays the gag at a quarter speed, which is handy for checking every beat
const SLOW = Math.max(1, Number(params.get('slow')) || 1);
// stopGag() cuts a running gag short. Every pending wait and tween fails at once, so the gag
// jumps straight to its finally block and tidies up. The failures are pre-marked as handled,
// because a gag does not await every tween it starts (the ball flies while the dog runs).
let gagStopped = false;
const gagWakers = new Set();
class GagStopped extends Error {}
function stopGag() {
  if (!gagRunning) return;
  gagStopped = true;
  gagWakers.forEach(w => w()); gagWakers.clear();
  el('gag').textContent = '';          // off the screen now, not on the next frame
  delete document.documentElement.dataset.gag;
}
const quiet = p => { p.catch(() => {}); return p; };
function wait(ms) {
  if (gagStopped) throw new GagStopped();
  return quiet(new Promise((resolve, reject) => {
    const t = setTimeout(() => { gagWakers.delete(stop); resolve(); }, ms * SLOW);
    const stop = () => { clearTimeout(t); reject(new GagStopped()); };
    gagWakers.add(stop);
  }));
}
function tween(ms, fn, ease = E.io) {
  if (gagStopped) throw new GagStopped();
  // Driven by wall-clock time, advanced by whichever arrives first: an animation frame or a
  // short timer. A browser that stops painting frames — a hidden tab, a headless render, a
  // throttled laptop — used to freeze the whole sequence half-way. Now it only gets choppier.
  ms *= SLOW;
  return quiet(new Promise((resolve, reject) => {
    const t0 = performance.now();
    let finished = false;
    const stop = () => { finished = true; reject(new GagStopped()); };
    gagWakers.add(stop);
    function frame() {
      if (finished) return;
      const raw = Math.min(1, (performance.now() - t0) / ms);
      fn(ease(raw), raw);
      if (raw >= 1) { finished = true; gagWakers.delete(stop); resolve(); } else schedule();
    }
    function schedule() {
      let fired = false;
      const go = () => { if (!fired) { fired = true; frame(); } };
      requestAnimationFrame(go);
      setTimeout(go, 34);
    }
    schedule();
  }));
}

let gagRunning = false;
async function poopGag() {
  const root = document.documentElement;
  if (gagRunning || root.dataset.scene !== 'city' || document.hidden) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pet = document.querySelector('#crew .pet');
  if (!pet) return;

  gagRunning = true;
  root.dataset.gag = '1';
  const layer = el('gag'); layer.textContent = '';
  const inner = pet.firstElementChild;
  const Y = 782, DX = 620, PX = DX - 46;       // where the dog stops, and where it lands
  const dog = (x, sx = 1, sy = 1, lift = 0) => {
    if (pet.isConnected) pet.setAttribute('transform', `translate(${x},${Y - lift}) scale(${sx},${sy})`);
  };

  try {
    // 1. the dog trots in
    pet.style.animation = 'none';
    await tween(2600, t => dog(lerp(-90, DX, t)), E.out);

    // 2. a sniff, a look around
    await tween(700, (t, raw) => dog(DX, 1, 1 - .05 * Math.sin(raw * Math.PI * 4)), E.lin);

    // 3. the squat, with a small determined wobble
    if (inner) inner.style.animation = 'none';
    await tween(600, t => dog(DX, 1 + .08 * t, 1 - .2 * t), E.out);
    await tween(900, (t, raw) => dog(DX + Math.sin(raw * 38) * 1.6, 1.08, .8), E.lin);

    // 4. plop
    const poop = node('g', { transform: `translate(${PX},${Y}) scale(0)` });
    poop.innerHTML = POOP;
    layer.appendChild(poop);
    await tween(560, t => poop.setAttribute('transform', `translate(${PX},${Y}) scale(${Math.max(0, E.back(t))})`), E.lin);

    // 5. stands up, very pleased, hops, and leaves without looking back
    await tween(320, t => dog(DX, lerp(1.08, 1, t), lerp(.8, 1.06, t)), E.out);
    await tween(420, (t, raw) => dog(DX, 1, 1, Math.sin(raw * Math.PI) * 26), E.lin);
    if (inner) inner.style.animation = '';
    say(pick(['SIR WIGGLEBUTT WOULD LIKE IT ON RECORD THAT THIS WAS NOT HIM.', 'SIR WIGGLEBUTT HAS LEFT A FEATURE REQUEST.', 'SIR WIGGLEBUTT IS DEPLOYING TO THE PAVEMENT.']));
    const dogLeaves = tween(3400, t => dog(lerp(DX, 1740, t)), E.lin);

    await wait(700);

    // 6. the swing in, on a line from somewhere above the rooftops
    const swingLine = node('line', { stroke: '#ffffff', 'stroke-width': 2.5, opacity: .8 });
    const webLine = node('line', { stroke: '#ffffff', 'stroke-width': 3.5, 'stroke-linecap': 'round' });
    const hero = node('g', { 'data-who': 'crawler' });
    hero.innerHTML = SPIDEY + '<rect x="-34" y="-46" width="72" height="96" fill="none" pointer-events="all"/>';
    layer.append(swingLine, webLine, hero);
    const HX = PX - 44, HY = 400, AX = PX + 40, AY = -80;
    const place = (x, y, r) => {
      hero.setAttribute('transform', `translate(${x},${y}) rotate(${r})`);
      swingLine.setAttribute('x1', x); swingLine.setAttribute('y1', y - 14);
      swingLine.setAttribute('x2', AX); swingLine.setAttribute('y2', AY);
    };
    await tween(2100, (t, raw) => place(lerp(-160, HX, t), lerp(120, HY, t) + Math.sin(raw * Math.PI) * 120, lerp(-42, 6, t)), E.io);
    await tween(700, (t, raw) => place(HX + Math.sin(raw * Math.PI * 2) * 12, HY, 10 * Math.cos(raw * Math.PI * 2)), E.lin);

    // 7. thwip
    const hx = HX + 27, hy = HY + 12;
    webLine.setAttribute('x1', hx); webLine.setAttribute('y1', hy);
    await tween(360, t => { webLine.setAttribute('x2', lerp(hx, PX, t)); webLine.setAttribute('y2', lerp(hy, Y - 16, t)); }, E.out);
    const splat = node('g', { transform: `translate(${PX},${Y - 16})` }); splat.innerHTML = SPLAT;
    layer.appendChild(splat);
    await tween(300, t => { splat.setAttribute('transform', `translate(${PX},${Y - 16}) scale(${.4 + t})`); splat.setAttribute('opacity', 1 - t); }, E.out);
    splat.remove();
    say(pick(['ANOTHER THREAT CLEARED. YOU ARE WELCOME, CITY.', 'THE STREETS ARE SAFE. FOR NOW.', 'NOT ON MY PAVEMENT.']));
    await wait(380);

    // 8. the yank: up, away, cargo swinging on the web below
    await tween(2600, (t, raw) => {
      const x = lerp(HX, 1780, t);
      const y = lerp(HY, 40, t) - Math.sin(raw * Math.PI) * 50;
      place(x, y, lerp(10, 34, t));
      const handX = x + 27, handY = y + 12;
      const reel = E.out(Math.min(1, raw * 2.4));          // first reel it off the ground
      const px = lerp(PX, handX - 8 + Math.sin(raw * 15) * 22, reel);
      const py = lerp(Y, handY + 120, reel);
      poop.setAttribute('transform', `translate(${px},${py}) rotate(${Math.sin(raw * 18) * 26 * reel})`);
      webLine.setAttribute('x1', handX); webLine.setAttribute('y1', handY);
      webLine.setAttribute('x2', px); webLine.setAttribute('y2', py - 16);
    }, E.io);

    await dogLeaves;
  } finally {
    layer.textContent = '';
    pet.style.animation = '';
    if (inner) inner.style.animation = '';
    delete root.dataset.gag;
    gagRunning = false;
    gagStopped = false;
  }
}

async function mazeGag() {
  const root = document.documentElement;
  if (gagRunning || root.dataset.scene !== 'maze' || document.hidden) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  gagRunning = true;
  root.dataset.gag = '1';
  const layer = el('gag'); layer.textContent = '';
  const stage = el('stage');
  const FLOOR = 818;

  const sprint = node('g', { 'data-who': 'sprint' });
  const sprintBody = node('g', { class: 'runlegs' }); sprintBody.innerHTML = SPRINT;
  sprint.appendChild(sprintBody);
  const creep = node('g', { 'data-who': 'creep' });
  const creepBody = node('g', { class: 'crawl' }); creepBody.innerHTML = CREEP;
  creep.appendChild(creepBody);
  const put = (g, x, y, sc, flip = false, rot = 0) => {
    g.setAttribute('transform', `translate(${x},${y}) rotate(${rot}) scale(${flip ? -sc : sc},${sc})`);
    if (g === sprint) sprintBody.classList.toggle('faceleft', flip);
  };

  try {
    // 1. the walls begin to close
    stage.classList.add('shake');
    setTimeout(() => stage.classList.remove('shake'), 1000);
    say('THE WALLS ARE CLOSING!', 2600 * SLOW);
    await tween(1300, t => setDoors(t * .55), E.io);

    // 2. out of the gate, at an unhurried jog, reading his map
    sprint.setAttribute('data-who', 'sprint');
    sprintBody.classList.add('sprint');
    put(sprint, 800, 770, .4, true); layer.appendChild(sprint);
    worldSay(layer, 800, 690, 'JUST A LIGHT JOG. CHECKING THE MAP.', 2000);
    await tween(2300, t => put(sprint, lerp(800, 640, t), lerp(770, FLOOR, t), lerp(.4, 1, t), true), E.lin);

    // 3. he stops. something is behind him. he turns round, slowly.
    sprintBody.classList.remove('runlegs');
    await wait(500);
    await tween(260, t => put(sprint, 640, FLOOR, 1, t < .5), E.lin);

    // 4. out comes Scope Creep
    put(creep, 800, 770, .35, true); layer.insertBefore(creep, sprint);
    await tween(1100, t => put(creep, lerp(800, 790, t), lerp(770, 790, t), lerp(.35, .8, t), true), E.out);

    // 5. terror. a leap straight up, a scream, sweat everywhere
    sprintBody.classList.add('scared', 'yelp');
    await tween(420, (t, raw) => put(sprint, 640, FLOOR - Math.sin(raw * Math.PI) * 70, 1, false), E.lin);
    worldSay(layer, 640, 520, 'AAAAAAAAAAAAH!', 1500);
    sprintBody.classList.remove('yelp');

    // 6. and he RUNS — arms everywhere, gut going, faster than he has moved in years
    sprintBody.classList.add('runlegs');
    const flee = tween(1900, t => put(sprint, lerp(640, 290, t), FLOOR, 1, true), E.in || (t => t * t));
    await wait(250);
    creepBody.classList.add('crawl');
    const chase = tween(2000, t => put(creep, lerp(790, 480, t), lerp(790, FLOOR, t), lerp(.8, 1.1, t), true), E.lin);
    await flee;

    // 7. he trips over absolutely nothing. the map goes flying.
    sprintBody.classList.remove('runlegs');
    sprint.querySelector('.sprint-map')?.remove();
    const flyingMap = node('g'); flyingMap.innerHTML = '<rect x="-10" y="-5" width="20" height="9" rx="4" fill="#f1e3b5" stroke="var(--ink)" stroke-width="2"/>';
    layer.appendChild(flyingMap);
    const mapFly = tween(700, (t, raw) => flyingMap.setAttribute('transform',
      `translate(${lerp(280, 380, t)},${FLOOR - 80 - Math.sin(raw * Math.PI) * 60 + raw * 76}) rotate(${raw * 540})`), E.lin);
    await tween(420, t => put(sprint, lerp(290, 252, t), FLOOR, 1, true, lerp(0, -84, t)), E.out);
    sprintBody.classList.add('cower');
    await Promise.all([chase, mapFly]);

    // 8. Scope Creep skids to a stop over him, and looms
    creepBody.classList.remove('crawl');
    await tween(260, (t, raw) => put(creep, 480 - Math.sin(raw * Math.PI) * 18, FLOOR, 1.1, true), E.out);
    await tween(700, t => put(creep, 480, FLOOR, lerp(1.1, 1.38, t), true), E.back);
    worldSay(layer, 252, 700, 'please no. i have a standup at nine.', 1600);
    await wait(1100);

    // 9. …and hands it back
    flyingMap.remove();
    const claw = creep.querySelector('.creep-claw');
    const held = node('g'); held.innerHTML = '<rect x="86" y="-33" width="20" height="9" rx="4" fill="#f1e3b5" stroke="var(--ink)" stroke-width="2"/>';
    claw.appendChild(held);
    worldSay(layer, 480, 532, 'YOU DROPPED YOUR MAP.', 1900);
    await wait(2000);
    worldSay(layer, 480, 532, 'ALSO. ONE MORE SMALL FEATURE.', 2100);
    await wait(2200);

    // 10. that does it. he faints.
    sprintBody.classList.remove('cower', 'scared');
    sprintBody.classList.add('fainted');
    await tween(300, t => put(sprint, 252, FLOOR, 1, true, lerp(-84, -92, t)), E.out);
    say('SPRINT HAS FAINTED. THE SPRINT IS OVER.', 4000 * SLOW);
    await wait(900);

    // 11. it leaves the map beside him, a little hurt, and goes home
    held.remove();
    const leftMap = node('g', { transform: `translate(330,${FLOOR - 4})` });
    leftMap.innerHTML = '<rect x="-10" y="-5" width="20" height="9" rx="4" fill="#f1e3b5" stroke="var(--ink)" stroke-width="2"/>';
    layer.appendChild(leftMap);
    worldSay(layer, 480, 532, 'I JUST WANTED TO ADD A BUTTON.', 1800);
    await wait(1400);
    creepBody.classList.add('crawl');
    await tween(2200, t => put(creep, lerp(480, 800, t), lerp(FLOOR, 770, t), lerp(1.38, .35, t), false), E.io);
    creep.remove();
    await tween(1200, t => setDoors((1 - t) * .55), E.io);

    // 12. he comes round, remembers, screams again, and is gone
    sprintBody.classList.remove('fainted');
    await tween(500, t => put(sprint, 252, FLOOR, 1, true, lerp(-92, 0, t)), E.back);
    sprintBody.classList.add('scared', 'yelp');
    worldSay(layer, 252, 660, 'NOPE.', 1200);
    leftMap.remove();
    sprintBody.classList.add('runlegs');
    await tween(1300, t => put(sprint, lerp(252, -160, t), FLOOR, 1, true), E.lin);
  } finally {
    layer.textContent = '';
    setDoors(0);
    stage.classList.remove('shake');
    delete root.dataset.gag;
    gagRunning = false;
    gagStopped = false;
  }
}

async function beachGag() {
  const root = document.documentElement;
  if (gagRunning || root.dataset.scene !== 'beach' || document.hidden) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pet = document.querySelector('#crew .pet');
  if (!pet) return;
  gagRunning = true;
  root.dataset.gag = '1';
  const layer = el('gag'); layer.textContent = '';
  const inner = pet.firstElementChild;
  const SAND = 782, WATER = 652;
  // Robots stand at x behind a desk from x-52 to x+52. Drown where none of them is, or the
  // dog vanishes behind a head — which is exactly what happened with three tasks running.
  const taken = [...document.querySelectorAll('#crew .unit')].map(u =>
    Number(u.getAttribute('transform').match(/translate\(([-\d.]+)/)[1]));
  let SPOT = 700, best = -1;
  for (let x = 240; x <= 1120; x += 10) {
    const clear = taken.length ? Math.min(...taken.map(r => x < r - 60 ? r - 60 - x : x > r + 60 ? x - r - 60 : -1)) : 999;
    if (clear > best) { best = clear; SPOT = x; }
  }
  const DS = .95;                                   // dog scale in the water: big enough to see

  const dog = (x, y, sc = 1, flip = false, rot = 0) => {
    if (pet.isConnected) pet.setAttribute('transform', `translate(${x},${y}) rotate(${rot}) scale(${flip ? -sc : sc},${sc})`);
  };
  const hero = node('g', { 'data-who': 'rollback' });
  const heroBody = node('g', { class: 'rb' }); heroBody.innerHTML = ROLLBACK; hero.appendChild(heroBody);
  const hput = (x, y, sc, flip, rot = 0) => hero.setAttribute('transform', `translate(${x},${y}) rotate(${rot}) scale(${flip ? -sc : sc},${sc})`);
  const ball = node('g');
  ball.innerHTML = `<circle cx="0" cy="-14" r="14" fill="#ffffff" stroke="var(--ink)" stroke-width="2"/>
    <path d="M0,-28 a14,14 0 0,1 0,28 z" fill="#ff5a5a"/><path d="M-14,-14 a14,14 0 0,1 14,-14 z" fill="#29b6f6"/>`;
  // Swimmers go inside this wrapper, which has no transform of its own, so the clip below
  // is measured in scene coordinates and cuts everything under the surface.
  const underwater = node('g', { 'clip-path': 'url(#aboveWater)' });
  const home = el('crew');
  const at = (g, x, y, sc = 1) => g.setAttribute('transform', `translate(${x},${y}) scale(${sc})`);
  const splash = (x, y) => {
    const sp = node('g', { transform: `translate(${x},${y})` });
    sp.innerHTML = `<g class="splash" fill="#ffffff" stroke="var(--ink)" stroke-width="1.5">
      <circle cx="-18" cy="-6" r="5"/><circle cx="0" cy="-14" r="6"/><circle cx="16" cy="-5" r="5"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="9" cy="-1" r="3"/></g>`;
    layer.appendChild(sp); setTimeout(() => sp.remove(), 700 * SLOW);
  };

  try {
    // 1. the ball gets away from him, and bounces into the sea
    pet.style.animation = 'none';
    layer.appendChild(ball);
    worldSay(layer, Math.max(200, SPOT - 240), 700, 'BALL. BALL. BALL. BALL.', 1600);
    const ballGo = tween(1500, (t, raw) => at(ball, lerp(SPOT - 230, SPOT + 40, t), lerp(SAND, WATER - 4, t) - Math.abs(Math.sin(raw * Math.PI * 3)) * 60), E.lin);
    await tween(1500, t => dog(lerp(SPOT - 440, SPOT - 120, t), SAND), E.lin);
    await ballGo;

    // 2. straight in after it, getting smaller as he swims out
    splash(SPOT - 80, WATER + 20);
    await tween(1100, t => {
      dog(lerp(SPOT - 120, SPOT, t), lerp(SAND, WATER + 26, t), lerp(1, DS, t));
      at(ball, lerp(SPOT + 40, SPOT + 80, t), WATER - 4 + Math.sin(t * 6) * 2);
    }, E.out);
    layer.appendChild(underwater);
    underwater.appendChild(pet);          // from here on, only what is above the surface shows

    // 3. he cannot, in fact, swim
    if (inner) inner.style.animation = 'none';
    const bubbles = node('g', { transform: `translate(${SPOT + 8},${WATER - 4})` });
    bubbles.innerHTML = `<g fill="none" stroke="#ffffff" stroke-width="2">
      <circle class="bubble-up" cx="-6" cy="0" r="4"/><circle class="bubble-up" style="animation-delay:.4s" cx="6" cy="0" r="3"/>
      <circle class="bubble-up" style="animation-delay:.8s" cx="0" cy="0" r="5"/></g>`;
    layer.appendChild(bubbles);
    worldSay(layer, SPOT, 560, 'BLUB. HELP. BLUB.', 1500);
    const flail = (raw, beats) => {
      const dip = Math.max(0, Math.sin(raw * Math.PI * beats)) * 24;   // head goes under on each beat
      dog(SPOT + Math.sin(raw * 30) * 3, WATER + 26 + dip, DS, false, Math.sin(raw * 22) * 12);
    };
    await tween(2600, (t, raw) => { flail(raw, 3); at(ball, lerp(SPOT + 80, SPOT + 150, t), WATER - 4 + Math.sin(raw * 12) * 2); }, E.lin);
    worldSay(layer, Math.min(1180, Math.max(360, SPOT)), 560, 'I AM A RETRIEVER. I FORGOT THE RETURN STATEMENT.', 2200);

    // 4. a whistle. and then, from the right, in slow motion
    say('FWEEEEEEEEEEEET!', 1400 * SLOW);
    heroBody.classList.add('rb-run');
    hput(1700, SAND, 1.05, true);
    layer.insertBefore(hero, underwater);
    worldSay(layer, Math.min(1300, SPOT + 420), 500, '* slow-motion running *', 2600);
    const dogStruggle = tween(3000, (t, raw) => flail(raw, 4), E.lin);
    await tween(3000, (t, raw) => hput(lerp(1700, SPOT + 240, t), SAND - Math.abs(Math.sin(raw * Math.PI * 5)) * 8, 1.05, true), E.lin);
    await dogStruggle;

    // 5. the dive
    heroBody.classList.remove('rb-run');
    await tween(700, (t, raw) => hput(lerp(SPOT + 240, SPOT + 80, t), lerp(SAND, WATER + 40, t) - Math.sin(raw * Math.PI) * 110, lerp(1.05, .86, t), true, lerp(0, -70, t)), E.lin);
    splash(SPOT + 80, WATER + 10);
    heroBody.classList.add('rb-swim');
    underwater.appendChild(hero);

    // 6. swims out, grabs him
    await tween(900, t => {
      hput(lerp(SPOT + 80, SPOT + 36, t), WATER + 40, .86, true, -70);
      dog(SPOT + Math.sin(t * 30) * 3, WATER + 26, DS, false, Math.sin(t * 22) * 12);
    }, E.lin);
    bubbles.remove();
    worldSay(layer, Math.min(1180, Math.max(300, SPOT + 20)), 520, 'HOLD ON, BUDDY. ROLLING YOU BACK.', 2000);

    // 7. back to shore, dog under one arm
    await tween(1000, t => {
      hput(lerp(SPOT + 36, SPOT + 70, t), lerp(WATER + 40, WATER + 12, t), lerp(.86, .95, t), true, lerp(-70, -10, t));
      dog(lerp(SPOT, SPOT + 50, t), lerp(WATER + 26, WATER - 30, t), lerp(DS, .9, t), false, lerp(12, 0, t));
    }, E.io);
    layer.appendChild(hero);              // out of the water: nothing is clipped any more
    layer.appendChild(pet);
    heroBody.classList.remove('rb-swim');
    await tween(700, t => {
      hput(lerp(SPOT + 70, SPOT + 100, t), lerp(WATER + 12, SAND, t), lerp(.95, 1.05, t), true, lerp(-10, 0, t));
      dog(lerp(SPOT + 50, SPOT + 80, t), lerp(WATER - 30, SAND - 64, t), .9);
    }, E.out);
    underwater.remove();

    // 8. set down on the sand. he shakes himself dry. all over the lifeguard.
    await tween(500, t => dog(lerp(SPOT + 80, SPOT + 20, t), lerp(SAND - 64, SAND, t), 1), E.out);
    if (inner) inner.classList.add('dog-shake');
    const spray = node('g', { transform: `translate(${SPOT + 40},${SAND - 30})` });
    spray.innerHTML = `<g class="splash" fill="#8fd3f4" stroke="var(--ink)" stroke-width="1.2">
      <circle cx="20" cy="-10" r="4"/><circle cx="40" cy="-24" r="3"/><circle cx="58" cy="-8" r="4"/>
      <circle cx="30" cy="-36" r="3"/><circle cx="70" cy="-30" r="3"/><circle cx="-20" cy="-18" r="3"/></g>`;
    layer.appendChild(spray);
    worldSay(layer, Math.max(220, SPOT + 20), 690, 'shake shake shake shake', 1400);
    await wait(1500);
    spray.remove();
    if (inner) inner.classList.remove('dog-shake');
    worldSay(layer, Math.min(1160, Math.max(340, SPOT + 120)), 520, 'ROLLED BACK TO LAST KNOWN GOOD STATE.', 2000);
    await wait(2000);

    // 9. the dog notices the ball is still out there
    worldSay(layer, Math.max(220, SPOT + 20), 690, '…ball.', 1100);
    await wait(900);
    heroBody.classList.add('facepalm');
    worldSay(layer, Math.min(1200, Math.max(300, SPOT + 120)), 520, 'NO. NO NO NO NO.', 1700);
    if (inner) inner.style.animation = '';
    await tween(1300, t => dog(lerp(SPOT + 20, SPOT - 20, t), lerp(SAND, WATER + 30, t), lerp(1, DS, t)), E.in || (t => t * t));
    heroBody.classList.remove('facepalm');
    heroBody.classList.add('rb-run');
    await tween(900, t => hput(lerp(SPOT + 100, SPOT + 40, t), SAND, 1.05, true), E.lin);
  } finally {
    if (gagStopped) pet.remove(); else home.appendChild(pet);
    layer.textContent = '';
    pet.style.animation = '';
    if (inner) { inner.style.animation = ''; inner.classList.remove('dog-shake'); }
    delete root.dataset.gag;
    gagRunning = false;
    gagStopped = false;
  }
}

// Speech that was sent a while ago, and says so.
function lateSay(layer, x, y, text, ago, ms = 1600) {
  const w = Math.min(420, 36 + text.length * 8.2);
  const b = node('g', { transform: `translate(${x},${y})` });
  b.innerHTML = `<rect class="prog-bg" x="${-w / 2}" y="-34" width="${w}" height="46" rx="10"/>
    <path class="prog-bg" d="M-8,12 l8,11 l8,-11 z"/>

          letter-spacing=".5">📡 sent ${ago} ago</text>`;
  layer.appendChild(b);
  setTimeout(() => b.remove(), ms * SLOW);
}

async function spaceGag() {
  const root = document.documentElement;
  if (gagRunning || root.dataset.scene !== 'space' || document.hidden) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  gagRunning = true;
  root.dataset.gag = '1';
  const layer = el('gag'); layer.textContent = '';
  const G = 846, HOP_X = 1210;

  const intern = node('g', { 'data-who': 'intern' });
  const ib = node('g', { class: 'intern' }); ib.innerHTML = INTERN; intern.appendChild(ib);
  const cap = node('g', { 'data-who': 'latency' });
  const cb = node('g'); cb.innerHTML = LATENCY; cap.appendChild(cb);
  const trail = node('path', { fill: '#9fd4ff', opacity: .6 });
  const place = (g, x, y, sc = 1, flip = false, rot = 0) =>
    g.setAttribute('transform', `translate(${x},${y}) rotate(${rot}) scale(${flip ? -sc : sc},${sc})`);
  const streak = (x, y, fromX, fromY) => trail.setAttribute('d',
    `M${x},${y - 40} L${fromX},${fromY - 30} L${fromX},${fromY - 90} L${x},${y - 90} Z`);

  try {
    // 1. out of the base for a walk, delighted with the gravity
    place(intern, 1640, G, 1, true); layer.appendChild(intern);
    worldSay(layer, 1300, 700, 'LOW GRAVITY. DAY ONE. WHEEE!', 2000);
    await tween(1800, (t, raw) => place(intern, lerp(1640, HOP_X, t), G - Math.abs(Math.sin(raw * Math.PI * 4)) * 14, 1, true), E.lin);

    // 2. three hops, each one bigger than he meant
    for (const h of [60, 110, 170]) {
      await tween(900, (t, raw) => place(intern, HOP_X, G - Math.sin(raw * Math.PI) * h, 1, true), E.lin);
    }

    // 3. the fourth goes up, and keeps going
    ib.classList.add('worried', 'flail');
    worldSay(layer, HOP_X, 640, '…uh.', 1200);
    await tween(3200, (t, raw) => {
      place(intern, lerp(HOP_X, 1140, t), lerp(G, 330, E.out(t)), 1, true, raw * 200);
      if (raw > .5 && !intern.dataset.said) { intern.dataset.said = '1'; worldSay(layer, 1140, 250, 'GRAVITY? HELLO? GRAVITY?', 1800); }
    }, E.lin);

    // 4. a streak from the far side of the sky, and he is caught. not a word is said.
    layer.insertBefore(trail, intern);
    place(cap, -220, 140, 1, false, 20); layer.appendChild(cap);
    await tween(650, t => {
      const x = lerp(-220, 1080, t), y = lerp(140, 350, t);
      place(cap, x, y, 1, false, 20); streak(x, y, -220, 140);
      place(intern, 1140, 330, 1, true, 640 + t * 40);
    }, E.out);
    trail.remove();
    ib.classList.remove('flail');

    // 5. flown back down and set on his feet
    await tween(1600, t => {
      place(cap, lerp(1080, 1320, t), lerp(350, G, t), 1, t > .5, lerp(20, 0, t));
      place(intern, lerp(1140, HOP_X, t), lerp(330, G, t), 1, true, lerp(680, 720, t));
    }, E.io);
    ib.classList.remove('worried');
    await wait(1300);                                  // an awkward, silent moment

    // 6. his messages arrive
    lateSay(layer, 1320, 640, 'HOLD ON!', '6 seconds', 1400); await wait(1500);
    lateSay(layer, 1320, 640, "I'M COMING!", '5 seconds', 1400); await wait(1500);
    lateSay(layer, 1320, 640, 'GOT YOU!', '4 seconds', 1600); await wait(1700);

    // 7. the conversation, such as it is
    worldSay(layer, HOP_X, 670, '…thanks? your messages are only arriving now.', 2300); await wait(2400);
    worldSay(layer, 1320, 640, 'YES. THEY DO THAT.', 1700); await wait(1800);
    worldSay(layer, HOP_X, 670, 'also, why does your cape stick out? there is no air up here.', 2600); await wait(2700);
    worldSay(layer, 1320, 640, 'BRAND CONSISTENCY.', 1800); await wait(1900);

    // 8. and he is gone. his goodbye takes a little longer.
    layer.insertBefore(trail, cap);
    await tween(700, t => {
      const x = lerp(1320, 1900, t), y = lerp(G, -200, t);
      place(cap, x, y, 1, false, lerp(0, 28, t)); streak(x, y, 1320, G);
    }, E.in || (t => t * t));
    trail.remove(); cap.remove();
    await wait(1200);
    lateSay(layer, 1320, 640, 'BYE!', '1 second', 1600);
    await wait(900);
    await tween(1500, (t, raw) => place(intern, lerp(HOP_X, 1640, t), G - Math.abs(Math.sin(raw * Math.PI * 3)) * 10, 1, false), E.lin);
  } finally {
    layer.textContent = '';
    delete root.dataset.gag;
    gagRunning = false;
    gagStopped = false;
  }
}

// ---------------------------------------------------------------- the pep talk
// Now and then the reviewer takes the rope off his belt and bonks every robot on the head,
// one after the other, nearest first. It reads each robot's position live, so it hits
// whoever is actually there: one robot, three, or none at all (then it does not happen).
const PEP_LINES = ['WE ARE FRIENDS. TYPE FASTER, FRIEND.', 'THIS IS A SAFE SPACE. NOW SHIP.',
  'I BELIEVE IN YOU. ALSO IN THE DEADLINE.', 'TEAMWORK! YOU WORK. I WATCH.',
  'FRIENDLY REMINDER. WITH A ROPE.', 'I SAID FRIENDLY. I DID NOT SAY SLOW.',
  'HUGS AFTER THE PR. HUGS ARE FASTER.', 'MORE COMMITS. FEWER FEELINGS.',
  'MOTIVATION HAS ARRIVED. IT IS A ROPE.', 'WORK HARDER. BUT, LIKE, WITH LOVE.'];
const OUCH_LINES = ['ow. ok. typing.', 'is this team building?', 'filing that under feedback.',
  'typing at 110%.', 'that was a merge conflict with my head.', 'love you too, boss.',
  'my skull is now asynchronous.', 'reporting this to HR. HR is also you.'];

async function ropeGag() {
  const root = document.documentElement;
  if (gagRunning || document.hidden) return false;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  const HX = 1350, HY = 762;
  const xOf = u => Number(u.getAttribute('transform').match(/translate\(([-\d.]+)/)[1]);
  const units = [...document.querySelectorAll('#crew .unit')].sort((a, b) => xOf(b) - xOf(a));
  if (!units.length) return false;

  gagRunning = true;
  root.dataset.gag = '1';
  const layer = el('gag'); layer.textContent = '';
  const heroBody = document.querySelector('#hero .hero-body');
  const hand = { x: HX - 50, y: HY - 92 - 60 };        // where the raised arm ends
  const back = node('path', { fill: 'none', stroke: '#3b2410', 'stroke-width': 6, 'stroke-linecap': 'round' });
  const rope = node('path', { fill: 'none', stroke: '#c58a4a', 'stroke-width': 3.5, 'stroke-linecap': 'round' });
  const loop = node('circle', { r: 7, fill: 'none', stroke: '#c58a4a', 'stroke-width': 3.5 });
  const draw = (tx, ty) => {
    const sag = 40 + Math.abs(hand.x - tx) * .12;
    const d = `M${hand.x},${hand.y} Q${(hand.x + tx) / 2},${Math.min(hand.y, ty) - sag} ${tx},${ty}`;
    back.setAttribute('d', d); rope.setAttribute('d', d);
    loop.setAttribute('cx', tx); loop.setAttribute('cy', ty);
  };

  try {
    let first = true;
    for (const unit of units) {
      if (!unit.isConnected) continue;                 // its run finished while we were busy
      const body = unit.querySelector('.bob');
      const head = () => ({ x: xOf(unit) + 4, y: HY - 100 });

      heroBody?.classList.add('throwing');
      if (first || Math.random() < .5) worldSay(layer, 1180, 520, pick(PEP_LINES), 2400);
      first = false;
      await wait(500);
      draw(hand.x, hand.y); layer.append(back, rope, loop);
      await tween(Math.min(900, 300 + (hand.x - head().x) * .45), t => {
        const h = head(); draw(lerp(hand.x, h.x, t), lerp(hand.y, h.y, t));
      }, E.out);

      // bonk
      const h = head();
      body?.classList.remove(...DANCES, ...ACTS);
      body?.classList.add('bonked');
      unit.classList.add('turbo');
      // beside the head, not above it: the task card lives above it
      const boom = node('g', { transform: `translate(${h.x + 34},${h.y + 12}) rotate(-12)` });
      boom.innerHTML = `<text x="0" y="0" text-anchor="start" font-size="18" font-weight="900" font-family="var(--mono)"
        fill="#ffd54f" stroke="var(--ink)" stroke-width="1.2">BONK!</text>`;
      const stars = node('g', { transform: `translate(${h.x},${h.y + 4})` });
      stars.innerHTML = `<g class="dizzy">${[0, 120, 240].map(a =>
        `<path transform="rotate(${a}) translate(22,0)" d="M0,-6 l2,4 4,1 -3,3 1,4 -4,-2 -4,2 1,-4 -3,-3 4,-1 z"
               fill="#ffd54f" stroke="var(--ink)" stroke-width="1"/>`).join('')}</g>`;
      layer.append(boom, stars);
      if (Math.random() < .75) miniSay(unit, pick(OUCH_LINES));
      await wait(380);

      // the rope comes home
      await tween(420, t => { const p = head(); draw(lerp(p.x, hand.x, t), lerp(p.y, hand.y, t)); }, E.io);
      back.remove(); rope.remove(); loop.remove();
      heroBody?.classList.remove('throwing');
      await wait(500);
      boom.remove(); stars.remove();
      body?.classList.remove('bonked');
      setTimeout(() => unit.classList.remove('turbo'), 5000 * SLOW);
      await wait(500);
    }
  } finally {
    layer.textContent = '';
    heroBody?.classList.remove('throwing');
    document.querySelectorAll('#crew .bonked').forEach(b => b.classList.remove('bonked'));
    delete root.dataset.gag;
    gagRunning = false;
    gagStopped = false;
  }
  return true;
}

// P plays whichever scene's gag is on screen; the timer does the same.
async function sceneGag() {
  const scene = document.documentElement.dataset.scene;
  const gag = { city: poopGag, maze: mazeGag, beach: beachGag, space: spaceGag }[scene];
  try {
    await gag?.();
  } catch (e) {
    if (!(e instanceof GagStopped)) throw e;   // a scene change cut it short: not an error
  }
}
addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') sceneGag();
  if (e.key === 'r' || e.key === 'R') ropeGag().catch(err => { if (!(err instanceof GagStopped)) throw err; });
});

// Each time Crawler starts a new swing across the city, he may announce himself.
document.querySelector('.swinger')?.addEventListener('animationiteration', e => {
  if (e.animationName !== 'swingby') return;
  const root = document.documentElement;
  if (root.dataset.scene !== 'city' || root.dataset.gag === '1') return;
  if (Math.random() < .6) setTimeout(() => { if (root.dataset.scene === 'city') say(pick(SWING_SHOUTS)); }, 1400);
});

// Hover anyone with a name to see who they are and what they are thinking. The tag follows
// the pointer, since none of them stand still, and the thought changes on every new hover.
(() => {
  const tag = el('nametag');
  const stage = el('stage');
  let current = null;
  stage.addEventListener('pointerover', e => {
    const who = e.target.closest('[data-who]');
    if (!who || who === current) return;
    current = who;
    const w = WHO[who.dataset.who];
    tag.querySelector('b').textContent = w.name;
    tag.querySelector('span').textContent = w.role;
    tag.querySelector('i').textContent = pick(w.thoughts);
    tag.style.left = e.clientX + 'px';
    tag.style.top = e.clientY + 'px';
    tag.hidden = false;
  });
  addEventListener('pointermove', e => {
    if (tag.hidden) return;
    tag.style.left = e.clientX + 'px';
    tag.style.top = e.clientY + 'px';
  });
  stage.addEventListener('pointerout', e => {
    if (!current) return;
    if (e.relatedTarget && current.contains(e.relatedTarget)) return;
    current = null;
    tag.hidden = true;
  });
})();
// Each scene has its own rhythm, counted from the end of the last gag so they never overlap.
// The beach rescue comes round often; the others are rarer, so they stay a surprise.
const GAG_GAP = { beach: 10000, city: 40000, maze: 40000, space: 30000 };
(async function gagLoop() {
  // ?gag=1 plays the current scene's gag straight away — a link you can send someone
  await new Promise(r => setTimeout(r, params.get('gag') ? 600 : 5000));
  for (;;) {
    try { await sceneGag(); } catch (e) { console.error(e); }   // one bad gag must not end the show
    const scene = document.documentElement.dataset.scene;
    await new Promise(r => setTimeout(r, GAG_GAP[scene] || 40000));
  }
})();
// The pep talk has its own rhythm, in every scene. When a scene gag is on, it waits its turn.
(async function ropeLoop() {
  await new Promise(r => setTimeout(r, params.get('rope') ? 800 : 25000));
  for (;;) {
    let ran = false;
    try { ran = await ropeGag(); } catch (e) { if (!(e instanceof GagStopped)) console.error(e); }
    await new Promise(r => setTimeout(r, ran ? 50000 : 5000));
  }
})();
</script>
