# Fast loop: take ready work off the board and open a pull request.
# Copied and filled in by /claudrunner:init.
name: claudrunner triage

on:
  schedule:
    - cron: "*/10 * * * *"   # raise this if the board is quiet; every poll costs a little
  workflow_dispatch:

# Never interrupt a run mid-change, and never start a second one beside it.
concurrency:
  group: claudrunner-triage
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # the orchestrator's own ceiling is lower, by design
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the review needs real history, not a shallow clone

      # init replaces this with the project's real setup, from the stack pack.
      - name: Set up the project
        run: echo "install dependencies here"

      - name: Install the agent and the crew
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add samiraklf/claudrunner
          claude plugin install claudrunner

      - name: Validate the configuration
        run: ./.claudrunner/bin/validate-config.sh

      - name: Run one triage cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Board credentials. Only the ones your board uses need to exist as secrets;
          # a secret that does not exist is simply empty here.
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_HOST: ${{ secrets.GITLAB_HOST }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
          SHORTCUT_API_TOKEN: ${{ secrets.SHORTCUT_API_TOKEN }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          # dashboard.where: server over SSH — the key comes from a secret, never from a file in the repo
          if [ -n "${{ secrets.CLAUDRUNNER_DASHBOARD_SSH_KEY }}" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/dash_key"
            printf '%s\n' "${{ secrets.CLAUDRUNNER_DASHBOARD_SSH_KEY }}" > "$RUNNER_TEMP/dash_key"
            export CLAUDRUNNER_DASHBOARD_SSH_KEY="$RUNNER_TEMP/dash_key"
          fi
          ./.claudrunner/bin/claudrunner-run.sh triage

      - name: Keep the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claudrunner-triage-${{ github.run_id }}
          path: .claudrunner/runs/
          retention-days: 14
