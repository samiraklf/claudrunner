# Slow loop: sweep the codebase and file what it finds.
# Copied and filled in by /claudrunner:init.
name: claudrunner sweep

on:
  schedule:
    - cron: "0 6 * * 1-5"    # a working hour, so a failure is read the same morning
  workflow_dispatch:
    inputs:
      scope:
        description: "security | scale | correctness | tests | all"
        default: all

concurrency:
  group: claudrunner-sweep
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the agent and the crew
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add samiraklf/claudrunner
          claude plugin install claudrunner

      - name: Sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Board credentials. Only the ones your board uses need to exist as secrets;
          # a secret that does not exist is simply empty here.
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_HOST: ${{ secrets.GITLAB_HOST }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
          SHORTCUT_API_TOKEN: ${{ secrets.SHORTCUT_API_TOKEN }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLAUDRUNNER_SCOPE: ${{ inputs.scope || 'all' }}
        run: ./.claudrunner/bin/claudrunner-run.sh sweep
