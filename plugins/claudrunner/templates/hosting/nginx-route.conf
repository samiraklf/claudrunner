# Serve the claudrunner status page on a path of a site you already run, e.g. example.com/claudrunner/.
# Add this inside that site's existing server block. The trailing slashes matter.
location /claudrunner/ {
    alias /var/www/claudrunner/;
    index index.html;
}
location = /claudrunner/status.json {
    alias /var/www/claudrunner/status.json;
    add_header Cache-Control "no-store";
}
