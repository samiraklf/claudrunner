# Serve the claudrunner status page on its own subdomain, e.g. crew.example.com.
# Point the subdomain's DNS at this server, set dashboard.server.webroot (same machine) or
# dashboard.server.ssh_target (CI uploads) to the root below, and add TLS with your usual tool.
server {
    listen 80;
    server_name crew.example.com;

    root /var/www/claudrunner;
    index index.html;

    # status.json changes every run: never let a browser or proxy hold an old one.
    location = /status.json {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
